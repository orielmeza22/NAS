                self.send_json({"success": False, "output": "Nombre de usuario o contraseña con formato inválido (solo a-z, 0-9, . _ - de 3 a 32 caracteres)."}, 400)
                return
    
            quoted_user = shlex.quote(user)
            quoted_pwd = shlex.quote(pwd)
    
