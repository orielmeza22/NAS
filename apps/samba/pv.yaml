apiVersion: v1
kind: PersistentVolume
metadata:
  name: samba-pv
  labels:
    app.kubernetes.io/name: samba
    app.kubernetes.io/part-of: nas-platform
spec:
  storageClassName: ""
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /tank/nas
    type: DirectoryOrCreate
  persistentVolumeReclaimPolicy: Retain
