    <!DOCTYPE html>
    <html lang="es">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Consola de Administración — Enterprise Storage Appliance</title>
      <style>
        :root {
          --bg-base: #0c1017;
          --bg-surface: #141a24;
          --bg-subtle: #1c2433;
          --border-subtle: #242d3d;
          --border-strong: #364257;
          --text-main: #f1f5f9;
          --text-muted: #8b9bb4;
          --text-disabled: #546279;
          --status-ok: #10b981;
          --status-ok-bg: rgba(16, 185, 129, 0.1);
          --status-warn: #f59e0b;
          --status-warn-bg: rgba(245, 158, 11, 0.1);
          --status-err: #ef4444;
          --status-err-bg: rgba(239, 68, 68, 0.1);
          --accent: #2563eb;
          --accent-hover: #1d4ed8;
          --font-mono: "SF Mono", "Menlo", "Consolas", monospace;
          --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-sans); }
        body { background: var(--bg-base); color: var(--text-main); font-size: 13px; line-height: 1.5; min-height: 100vh; display: flex; flex-direction: column; }
        
        /* Barra superior técnica */
        header { background: var(--bg-surface); border-bottom: 1px solid var(--border-subtle); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        .header-left { display: flex; align-items: center; gap: 14px; }
        .app-title { font-size: 14px; font-weight: 700; letter-spacing: -0.01em; color: var(--text-main); display: flex; align-items: center; gap: 8px; }
        .status-indicator { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px; font-family: var(--font-mono); text-transform: uppercase; }
        .status-indicator.ok { background: var(--status-ok-bg); color: var(--status-ok); border: 1px solid var(--status-ok); }
        .status-indicator.degraded { background: var(--status-err-bg); color: var(--status-err); border: 1px solid var(--status-err); }
        
        .header-actions { display: flex; align-items: center; gap: 8px; }
        .btn { background: var(--bg-subtle); color: var(--text-main); border: 1px solid var(--border-strong); padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 500; transition: background 0.15s, border-color 0.15s; }
        .btn:hover { background: #283347; border-color: #4b5a75; }
        .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
        .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
        .btn-danger { background: #7f1d1d; border-color: #991b1b; color: #fecaca; }
        .btn-danger:hover { background: #991b1b; }
        .btn-sm { padding: 3px 8px; font-size: 11px; }
    
        /* Layout principal */
        main { padding: 16px 20px; flex: 1; max-width: 1440px; margin: 0 auto; width: 100%; }
        
        /* Navegación por pestañas sobria */
        .tab-bar { display: flex; gap: 2px; border-bottom: 1px solid var(--border-subtle); margin-bottom: 16px; }
        .tab-item { background: transparent; border: none; border-bottom: 2px solid transparent; color: var(--text-muted); padding: 8px 14px; font-size: 12px; font-weight: 600; cursor: pointer; }
        .tab-item:hover { color: var(--text-main); }
        .tab-item.active { color: #60a5fa; border-bottom-color: #60a5fa; }
    
        /* Encabezado descriptivo de módulo */
        .module-header { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 4px; padding: 12px 16px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
        .module-header h2 { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-main); margin-bottom: 2px; }
        .module-header p { font-size: 12px; color: var(--text-muted); }
        .module-tag { font-family: var(--font-mono); font-size: 11px; color: var(--text-disabled); }
    
        /* Tarjetas y métricas */
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 16px; }
        .metric-card { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 4px; padding: 12px 14px; }
        .metric-label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }
        .metric-value { font-family: var(--font-mono); font-size: 20px; font-weight: 700; color: var(--text-main); }
        .metric-footnote { font-size: 11px; color: var(--text-disabled); margin-top: 4px; }
    
        /* Secciones y paneles */
        .panel { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 4px; padding: 14px 16px; margin-bottom: 16px; }
        .panel-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-main); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .panel-hint { font-size: 11px; color: var(--text-muted); margin-bottom: 12px; line-height: 1.4; }
    
        /* Tablas densas */
        .table-wrapper { border: 1px solid var(--border-subtle); border-radius: 4px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; }
        th { background: var(--bg-subtle); color: var(--text-muted); padding: 8px 12px; font-weight: 600; border-bottom: 1px solid var(--border-subtle); font-size: 11px; text-transform: uppercase; letter-spacing: 0.02em; }
        td { padding: 8px 12px; border-bottom: 1px solid var(--border-subtle); color: var(--text-main); }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(255, 255, 255, 0.015); }
        .font-mono { font-family: var(--font-mono); }
    
        /* Filas de acción técnica */
        .action-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border: 1px solid var(--border-subtle); border-radius: 4px; margin-bottom: 8px; background: var(--bg-base); }
        .action-row:last-child { margin-bottom: 0; }
        .action-title { font-size: 12px; font-weight: 600; color: var(--text-main); }
        .action-desc { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    
        /* Terminal y logs */
        .console-view { background: #070a0f; border: 1px solid var(--border-subtle); border-radius: 4px; padding: 12px; font-family: var(--font-mono); font-size: 11px; color: #a7f3d0; max-height: 380px; overflow-y: auto; white-space: pre-wrap; line-height: 1.45; }
    
        /* Modales */
        .modal-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); display: none; place-items: center; z-index: 1000; }
        .modal-backdrop.active { display: grid; }
        .modal-dialog { background: var(--bg-surface); border: 1px solid var(--border-strong); border-radius: 6px; width: 92%; max-width: 480px; padding: 20px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }
        .modal-dialog h3 { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
        .modal-dialog p { font-size: 12px; color: var(--text-muted); margin-bottom: 14px; }
        input, textarea, select { width: 100%; background: var(--bg-base); border: 1px solid var(--border-strong); border-radius: 4px; padding: 8px 10px; color: var(--text-main); font-size: 12px; margin-bottom: 12px; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
    
        /* Vista pública limpia */
        .public-container { max-width: 460px; margin: 60px auto; background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 6px; padding: 30px; text-align: center; }
        .qr-frame { width: 220px; height: 220px; margin: 16px auto; background: #fff; padding: 10px; border-radius: 4px; display: block; }
        .endpoint-link { display: inline-block; word-break: break-all; font-family: var(--font-mono); font-size: 12px; color: #60a5fa; background: var(--bg-subtle); padding: 6px 12px; border-radius: 4px; border: 1px solid var(--border-subtle); text-decoration: none; margin-top: 10px; }
      </style>
    </head>
    <body>
      <header>
        <div class="header-left">
          <span class="app-title">Storage Appliance OS</span>
          <span id="raid-badge" class="status-indicator ok">RAID-Z1: ONLINE</span>
        </div>
        <div class="header-actions">
          <button class="btn" id="btn-wan-toggle" onclick="toggleWanAccess()" title="Habilita o deshabilita el túnel público Cloudflare">
            WAN: Activo (Desconectar)
          </button>
          <button class="btn" onclick="rotateWanEndpoint()" title="Genera un nuevo subdominio de túnel sin reiniciar el host">
            Regenerar endpoint WAN
          </button>
          <button class="btn btn-primary" id="btn-auth-toggle" onclick="openLoginModal()">
            Autenticación de administrador
          </button>
        </div>
      </header>
    
      <main>
        <!-- VISTA PÚBLICA -->
        <div id="view-public" class="public-container">
          <h2 style="font-size:15px; font-weight:700;">Acceso de Usuario (Nextcloud)</h2>
          <p style="color:var(--text-muted); font-size:12px; margin-top:6px;">
            Punto de enlace seguro para sincronización de archivos institucionales.
          </p>
          <img id="qr-preview" class="qr-frame" src="" alt="Código QR del endpoint">
          <div>
            <a id="url-preview" class="endpoint-link" href="#" target="_blank">Resolviendo endpoint WAN...</a>
          </div>
          <div style="margin-top:24px; padding-top:14px; border-top:1px solid var(--border-subtle); font-size:11px; color:var(--text-disabled);">
            Modo de solo lectura para clientes. La gestión de almacenamiento y usuarios requiere autenticación de administrador.
          </div>
        </div>
    
        <!-- CONSOLA DE ADMINISTRACIÓN -->
        <div id="view-admin" style="display:none;">
          <div class="tab-bar">
            <button class="tab-item active" onclick="navigateTab('overview')">Telemetría de Sistema</button>
            <button class="tab-item" onclick="navigateTab('storage')">Almacenamiento (ZFS RAID)</button>
            <button class="tab-item" onclick="navigateTab('backups')">Copias de Seguridad (R2)</button>
            <button class="tab-item" onclick="navigateTab('identity')">Identidad y Accesos</button>
            <button class="tab-item" onclick="navigateTab('filesystem')">Sistema de Archivos</button>
            <button class="tab-item" onclick="navigateTab('security')">Seguridad y Resiliencia</button>
            <button class="tab-item" onclick="navigateTab('services')">Subsistemas K3s</button>
            <button class="tab-item" onclick="navigateTab('diagnostics')">Diagnóstico y Auditoría</button>
          </div>
    
          <!-- 1. TELEMETRÍA DE SISTEMA -->
          <div id="tab-overview" class="tab-content">
            <div class="module-header">
              <div>
                <h2>Telemetría de Hardware y Subsistemas</h2>
                <p>Métricas operativas de CPU, asignación de memoria RAM física y caché transaccional OpenZFS ARC.</p>
              </div>
              <span class="module-tag">Subsistema: Linux Host / K3s Node</span>
            </div>
    
            <div class="metrics-grid">
              <div class="metric-card">
                <div class="metric-label">Carga de CPU</div>
                <div class="metric-value" id="metric-cpu">-- %</div>
                <div class="metric-footnote">Uso del procesador en tiempo real</div>
              </div>
              <div class="metric-card">
                <div class="metric-label">Memoria RAM Asignada</div>
                <div class="metric-value" id="metric-ram">-- / -- MB</div>
                <div class="metric-footnote">Consumo de procesos y contenedores</div>
              </div>
              <div class="metric-card">
                <div class="metric-label">Caché OpenZFS ARC</div>
                <div class="metric-value" id="metric-arc">-- MB</div>
                <div class="metric-footnote">Páginas de lectura residentes en memoria</div>
              </div>
            </div>
    
            <div class="panel">
              <div class="panel-title">Operaciones de Energía y Mantenimiento del Nodo</div>
              <div class="panel-hint">Ejecución de directivas del kernel para la gestión de buffers y ciclo de vida del servidor físico.</div>
              
              <div class="action-row">
                <div>
                  <div class="action-title">Liberar memoria caché de páginas (Flush ARC)</div>
                  <div class="action-desc">Sincroniza buffers pendientes y vacía la caché no utilizada invocando drop_caches del kernel.</div>
                </div>
                <button class="btn btn-sm" onclick="dispatchFlushArc()">Ejecutar</button>
              </div>
    
              <div class="action-row">
                <div>
                  <div class="action-title">Reinicio controlado del host (Safe Reboot)</div>
                  <div class="action-desc">Termina ordenadamente los procesos de PostgreSQL, Samba y K3s antes de enviar la señal de reinicio.</div>
                </div>
                <button class="btn btn-sm btn-danger" onclick="dispatchReboot()">Reiniciar</button>
              </div>
    
              <div class="action-row">
                <div>
                  <div class="action-title">Apagado seguro del almacenamiento (Safe Poweroff)</div>
                  <div class="action-desc">Ejecuta zpool sync forzado para garantizar consistencia transaccional antes de interrumpir la energía.</div>
                </div>
                <button class="btn btn-sm btn-danger" onclick="dispatchShutdown()">Apagar</button>
              </div>
            </div>
          </div>
    
          <!-- 2. ALMACENAMIENTO (ZFS RAID) -->
          <div id="tab-storage" class="tab-content" style="display:none;">
            <div class="module-header">
              <div>
                <h2>Topología de Discos y Redundancia (Pool: tank)</h2>
                <p>Configuración del arreglo RAID-Z1 (paridad simple), inspección de vdevs y gestión de cuotas por dataset.</p>
              </div>
              <span class="module-tag">Mecanismo: OpenZFS v2.2</span>
            </div>
    
            <div class="panel">
              <div class="panel-title">
                <span>Dispositivos de Bloque del Arreglo RAID-Z1</span>
                <div style="display:flex; gap:6px;">
                  <button class="btn btn-sm btn-danger" onclick="dispatchSimulateDiskFailure()">Simular falla vdev (disk2 offline)</button>
                  <button class="btn btn-sm btn-primary" onclick="dispatchRepairDisk()">Reconstruir vdev (Resilver)</button>
                  <button class="btn btn-sm" onclick="dispatchAddHotSpare()">Asignar Hot-Spare</button>
                  <button class="btn btn-sm" onclick="dispatchScrub()">Ejecutar Scrub</button>
                </div>
              </div>
              <div class="panel-hint">
                <strong>Operaciones disponibles:</strong><br>
                • <em>Simular falla vdev:</em> Establece el dispositivo disk2.img en estado OFFLINE mediante zpool offline. El arreglo pasa a DEGRADED pero mantiene la disponibilidad total de datos.<br>
                • <em>Reconstruir vdev:</em> Vuelve a asociar el dispositivo disk2.img y ejecuta la reconstrucción de paridad diferencial (resilver).<br>
                • <em>Asignar Hot-Spare:</em> Vincula disk4.img como dispositivo de reserva para reemplazo automático ante rotura mecánica.<br>
                • <em>Ejecutar Scrub:</em> Audita la suma de verificación de todos los bloques en disco para corregir bit-rot en background.
              </div>
              <div class="table-wrapper">
                <table>
                  <thead>
                    <tr>
                      <th>Dispositivo vdev</th>
                      <th>Estado</th>
                      <th>Errores Lectura</th>
                      <th>Errores Escritura</th>
                      <th>Errores Checksum</th>
                    </tr>
                  </thead>
                  <tbody id="storage-disks-body"></tbody>
                </table>
              </div>
            </div>
    
            <div class="panel">
              <div class="panel-title">Estructura de Datasets y Cuotas de Almacenamiento</div>
              <div class="panel-hint">Límites estrictos de capacidad asignada para prevenir denegación de servicio por llenado de disco.</div>
              <div class="table-wrapper">
                <table>
                  <thead>
                    <tr>
                      <th>Dataset</th>
                      <th>Espacio Usado</th>
                      <th>Disponible</th>
                      <th>Cuota Límite</th>
                      <th>Compresión</th>
                      <th>Tamaño Bloque</th>
                      <th>Operación</th>
                    </tr>
                  </thead>
                  <tbody id="storage-datasets-body"></tbody>
                </table>
              </div>
            </div>
          </div>
    
          <!-- 3. COPIAS DE SEGURIDAD (R2) -->
          <div id="tab-backups" class="tab-content" style="display:none;">
            <div class="module-header">
              <div>
                <h2>Copias de Seguridad Locales y Replicación Externa</h2>
                <p>Puntos de recuperación atómicos OpenZFS y sincronización offsite hacia Cloudflare R2 con cifrado AES-256-CBC.</p>
              </div>
              <span class="module-tag">Estrategia: Resiliencia 3-2-1</span>
            </div>
    
            <div class="panel">
              <div class="panel-title">
                <span>Instantáneas Locales de Almacenamiento (Snapshots)</span>
                <button class="btn btn-sm btn-primary" onclick="dispatchCreateSnapshot()">Generar instantánea manual</button>
              </div>
              <div class="panel-hint">
                Las instantáneas permiten reversión de estado en menos de 5 segundos. La directiva <em>Inmutabilidad</em> aplica zfs hold para impedir la eliminación por software malicioso.
              </div>
              <div class="table-wrapper">
                <table>
                  <thead>
                    <tr>
                      <th>Identificador de Instantánea</th>
                      <th>Espacio Diferencial</th>
                      <th>Fecha de Creación</th>
                      <th>Inmutabilidad (Hold)</th>
                      <th>Operaciones</th>
                    </tr>
                  </thead>
                  <tbody id="backups-snapshots-body"></tbody>
                </table>
              </div>
            </div>
    
            <div class="panel">
              <div class="panel-title">
                <span>Objetos Cifrados en Almacenamiento Offsite (Cloudflare R2: nas-backup)</span>
                <div style="display:flex; gap:6px;">
                  <button class="btn btn-sm btn-primary" onclick="dispatchTriggerR2Backup()">Ejecutar respaldo a R2</button>
                  <button class="btn btn-sm" onclick="dispatchDrDrill()">Verificar integridad (DR Drill)</button>
                </div>
              </div>
              <div class="panel-hint">
                Sincronización semanal completa e incremental diaria transmitida directamente en memoria vía openssl y rclone sin almacenamiento intermedio en disco.
              </div>
              <div class="table-wrapper">
                <table>
                  <thead>
                    <tr>
                      <th>Nombre del Objeto Remoto</th>
                      <th>Tamaño Cifrado</th>
                      <th>Operación</th>
                    </tr>
                  </thead>
                  <tbody id="backups-r2-body"></tbody>
                </table>
              </div>
            </div>
          </div>
    
          <!-- 4. IDENTIDAD Y ACCESOS -->
          <div id="tab-identity" class="tab-content" style="display:none;">
            <div class="module-header">
              <div>
                <h2>Directorio de Cuentas y Control de Acceso</h2>
                <p>Aprovisionamiento simultáneo de credenciales en el servidor SMB de red local y en la plataforma web Nextcloud.</p>
              </div>
              <span class="module-tag">Ámbito: LAN (Samba) + WAN (Nextcloud)</span>
            </div>
    
            <div class="metrics-grid">
              <div class="panel">
                <div class="panel-title">Crear Cuenta Individual</div>
                <div class="panel-hint">Registra el usuario en la base de datos de Nextcloud y en la base smbpasswd de Samba.</div>
                <input type="text" id="input-username" placeholder="Identificador de usuario (ej: j.perez)">
                <input type="password" id="input-password" placeholder="Contraseña">
                <button class="btn btn-primary btn-sm" style="width:100%;" onclick="dispatchCreateUser()">Registrar Cuenta</button>
              </div>
    
              <div class="panel">
                <div class="panel-title">Aprovisionamiento Masivo (Lote CSV)</div>
                <div class="panel-hint">Formato requerido por línea: <code>usuario,contraseña,rol</code>.</div>
                <textarea id="input-csv" rows="3" placeholder="alumno01,SecretPass2026!,alumnos&#10;alumno02,SecretPass2026!,alumnos"></textarea>
                <button class="btn btn-sm" style="width:100%;" onclick="dispatchImportCsv()">Procesar Archivo CSV</button>
              </div>
            </div>
    
            <div class="panel">
              <div class="panel-title">Cuentas Registradas en el Sistema</div>
              <div id="identity-users-box" class="console-view">Cargando directorio de usuarios...</div>
            </div>
          </div>
    
          <!-- 5. SISTEMA DE ARCHIVOS -->
          <div id="tab-filesystem" class="tab-content" style="display:none;">
            <div class="module-header">
              <div>
                <h2>Explorador de Almacenamiento y Papelera de Red</h2>
                <p>Estructura de directorios en <code>/tank/nas</code> con protección de borrado accidental mediante vfs_recycle.</p>
              </div>
              <span class="module-tag">Directorio base: /tank/nas</span>
            </div>
    
            <div class="panel">
              <div class="panel-title">
                <span>Contenido del Directorio Activo</span>
                <span id="fs-current-path" class="font-mono" style="color:#60a5fa; font-size:11px;">/tank/nas</span>
              </div>
              <div class="panel-hint">
                La eliminación de elementos los reubica en el dataset de retención <code>.Papelera</code> para permitir su recuperación selectiva.
              </div>
              <div class="table-wrapper">
                <table>
                  <thead>
                    <tr>
                      <th>Nombre</th>
                      <th>Tipo</th>
                      <th>Tamaño</th>
                      <th>Fecha de Modificación</th>
                      <th>Operación</th>
                    </tr>
                  </thead>
                  <tbody id="fs-table-body"></tbody>
                </table>
              </div>
            </div>
          </div>
    
          <!-- 6. SEGURIDAD Y RESILIENCIA -->
          <div id="tab-security" class="tab-content" style="display:none;">
            <div class="module-header">
              <div>
                <h2>Escudo Anti-Ransomware y Registro Forense</h2>
                <p>Inspección de firmas maliciosas en Samba, descarte de ejecutables en perfiles de alumnos y centinela de archivos señuelo.</p>
              </div>
              <span class="module-tag">Centinela: ransomware-sentinel daemon</span>
            </div>
    
            <div class="metrics-grid">
              <div class="metric-card">
                <div class="metric-label">Estado del Centinela</div>
                <div class="metric-value" id="security-shield-status" style="color:var(--status-ok);">NOMINAL</div>
                <div class="metric-footnote">Verificación SHA256 de archivos señuelo activa</div>
              </div>
              <div class="metric-card">
                <div class="metric-label">Amenazas Aisladas</div>
                <div class="metric-value" id="security-threats-count">0</div>
                <div class="metric-footnote">Archivos en cuarentena preventiva</div>
              </div>
            </div>
    
            <div class="panel">
              <div class="panel-title">
                <span>Pruebas de Resiliencia en Tiempo Real</span>
                <button class="btn btn-sm" onclick="dispatchTestCanary()">Alterar archivo señuelo (Simulación)</button>
              </div>
              <div class="panel-hint">
                Simula la modificación no autorizada de un archivo honeypot para evaluar el tiempo de detección y aislamiento del centinela (&lt;5 segundos).
              </div>
            </div>
    
            <div class="panel">
              <div class="panel-title">Registro Forense de Incidentes de Seguridad</div>
              <div id="security-logs-box" class="console-view">Sin incidentes registrados.</div>
            </div>
          </div>
    
          <!-- 7. SUBSISTEMAS K3S -->
          <div id="tab-services" class="tab-content" style="display:none;">
            <div class="module-header">
              <div>
                <h2>Estado de Microservicios Orquestados</h2>
                <p>Supervisión de pods del clúster K3s para Nextcloud, PostgreSQL 16, Redis 7, Samba y agentes de telemetría.</p>
              </div>
              <span class="module-tag">Plano de Control: K3s Edge</span>
            </div>
    
            <div class="panel">
              <div class="panel-title">Instancias en Ejecución</div>
              <div class="table-wrapper">
                <table>
                  <thead>
                    <tr>
                      <th>Servicio / Despliegue</th>
                      <th>Instancias Listas</th>
                      <th>Estado del Pod</th>
                      <th>Reinicios Históricos</th>
                      <th>Acción</th>
                    </tr>
                  </thead>
                  <tbody id="services-table-body"></tbody>
                </table>
              </div>
            </div>
          </div>
    
          <!-- 8. DIAGNÓSTICO Y AUDITORÍA -->
          <div id="tab-diagnostics" class="tab-content" style="display:none;">
            <div class="module-header">
              <div>
                <h2>Validación Integral y Reporte de Conformidad</h2>
                <p>Ejecución de la suite automatizada de 18 comprobaciones de arquitectura y generación de informe técnico para auditorías.</p>
              </div>
              <span class="module-tag">Norma: Smoke Test Suite v2.0</span>
            </div>
    
            <div class="panel">
              <div class="panel-title">
                <span>Batería de Pruebas de Subsistemas</span>
                <div style="display:flex; gap:6px;">
                  <button class="btn btn-sm btn-primary" onclick="dispatchSmokeTests()">Ejecutar suite (18 pruebas)</button>
                  <button class="btn btn-sm" onclick="dispatchDownloadReport()">Descargar reporte técnico (.md)</button>
                </div>
              </div>
              <div class="panel-hint">
                Valida estado de nodos, controllers de Sealed Secrets, cuotas ZFS de 8K para base de datos, métricas Prometheus y túnel Zero-Trust.
              </div>
              <div id="diagnostics-log-box" class="console-view">Presione 'Ejecutar suite' para iniciar la verificación integral de subsistemas.</div>
            </div>
          </div>
        </div>
      </main>
    
      <!-- MODAL DE AUTENTICACIÓN -->
      <div id="modal-auth" class="modal-backdrop">
        <div class="modal-dialog">
          <h3>Autenticación de Administrador</h3>
          <p>Introduzca la clave maestra para obtener privilegios operativos de almacenamiento y configuración.</p>
          <input type="password" id="auth-input-pass" placeholder="Clave de administración" onkeydown="if(event.key==='Enter') executeLogin()">
          <div style="display:flex; justify-content:flex-end; gap:8px;">
            <button class="btn btn-sm" onclick="closeLoginModal()">Cancelar</button>
            <button class="btn btn-sm btn-primary" onclick="executeLogin()">Autenticar</button>
          </div>
        </div>
      </div>
    
      <!-- MODAL DE VISUALIZACIÓN DE LOGS -->
      <div id="modal-logs" class="modal-backdrop">
        <div class="modal-dialog" style="max-width:800px;">
          <h3 id="logs-modal-title">Registro de Eventos del Contenedor</h3>
          <div id="logs-modal-content" class="console-view" style="margin:10px 0; max-height:400px;"></div>
          <div style="display:flex; justify-content:flex-end;">
            <button class="btn btn-sm" onclick="closeLogsModal()">Cerrar</button>
          </div>
        </div>
      </div>
    
      <script>
        let sessionToken = localStorage.getItem('appliance_auth_token') || '';
    
        function evaluateSession() {
          const publicView = document.getElementById('view-public');
          const adminView = document.getElementById('view-admin');
          const authBtn = document.getElementById('btn-auth-toggle');
    
          if (sessionToken) {
            publicView.style.display = 'none';
            adminView.style.display = 'block';
            authBtn.textContent = 'Cerrar sesión';
            authBtn.classList.remove('btn-primary');
            authBtn.onclick = executeLogout;
            requestSystemMetrics();
          } else {
            publicView.style.display = 'block';
            adminView.style.display = 'none';
            authBtn.textContent = 'Autenticación de administrador';
            authBtn.classList.add('btn-primary');
            authBtn.onclick = openLoginModal;
            requestPublicStatus();
          }
        }
    
        async function requestPublicStatus() {
          try {
            const res = await fetch('/api/public/status');
            const data = await res.json();
            const badge = document.getElementById('raid-badge');
            
            if (data.raid_health === 'ONLINE') {
              badge.className = 'status-indicator ok';
              badge.textContent = 'RAID-Z1: ONLINE';
            } else {
              badge.className = 'status-indicator degraded';
              badge.textContent = 'RAID-Z1: ' + data.raid_health;
            }
    
            const wanBtn = document.getElementById('btn-wan-toggle');
            if (data.tunnel_url && data.tunnel_url.startsWith('http')) {
              wanBtn.textContent = 'WAN: Activo (Desconectar)';
              wanBtn.className = 'btn';
              wanBtn.title = 'Deshabilita el túnel público Cloudflare';
              document.getElementById('qr-preview').src = 'https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=' + encodeURIComponent(data.tunnel_url);
              const link = document.getElementById('url-preview');
              link.href = data.tunnel_url;
              link.textContent = data.tunnel_url;
            } else {
              wanBtn.textContent = 'WAN: Inactivo (Reconectar)';
              wanBtn.className = 'btn btn-primary';
              wanBtn.title = 'Habilita el túnel público Cloudflare';
              const link = document.getElementById('url-preview');
              link.href = '#';
              link.textContent = 'Endpoint WAN desconectado (Modo LAN estricto)';
            }
          } catch (err) {
            console.error('Error al consultar estado público:', err);
          }
        }
    
        function openLoginModal() {
          const modal = document.getElementById('modal-auth');
          modal.classList.add('active');
          const input = document.getElementById('auth-input-pass');
          input.value = '';
          setTimeout(() => input.focus(), 50);
        }
    
        function closeLoginModal() {
          document.getElementById('modal-auth').classList.remove('active');
        }
    
        async function executeLogin() {
          const pass = document.getElementById('auth-input-pass').value;
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: pass })
          });
          const data = await res.json();
          if (data.success) {
            sessionToken = data.token;
            localStorage.setItem('appliance_auth_token', sessionToken);
            closeLoginModal();
            evaluateSession();
          } else {
            alert(data.error || 'Credenciales no autorizadas.');
          }
        }
    
        function executeLogout() {
          sessionToken = '';
          localStorage.removeItem('appliance_auth_token');
          evaluateSession();
        }
    
        function navigateTab(tabKey) {
          document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
          document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
          event.target.classList.add('active');
          document.getElementById('tab-' + tabKey).style.display = 'block';
    
          if (tabKey === 'overview') requestSystemMetrics();
          if (tabKey === 'storage') requestStorageMetrics();
          if (tabKey === 'backups') requestBackupMetrics();
          if (tabKey === 'identity') requestIdentityMetrics();
          if (tabKey === 'filesystem') requestFilesystemMetrics();
          if (tabKey === 'security') requestSecurityMetrics();
          if (tabKey === 'services') requestServicesMetrics();
        }
    
        async function callApi(endpoint, method = 'GET', payload = null) {
          const options = {
            method,
            headers: {
              'Authorization': 'Bearer ' + sessionToken,
              'Content-Type': 'application/json'
            }
          };
          if (payload) options.body = JSON.stringify(payload);
          const res = await fetch(endpoint, options);
          if (res.status === 401) {
            executeLogout();
            return null;
          }
          return res.json();
        }
    
        async function requestSystemMetrics() {
          const sys = await callApi('/api/system/status');
          if (sys) {
            document.getElementById('metric-cpu').textContent = sys.cpu_usage_percent + ' %';
            document.getElementById('metric-ram').textContent = sys.used_ram_mb + ' / ' + sys.total_ram_mb + ' MB';
            document.getElementById('metric-arc').textContent = sys.zfs_arc_mb + ' MB';
          }
        }
    
        async function requestStorageMetrics() {
          const r = await callApi('/api/raid/status');
          if (r && r.disks) {
            const tbody = document.getElementById('storage-disks-body');
            tbody.innerHTML = r.disks.map(d => `
              <tr>
                <td class="font-mono">${d.name}</td>
                <td><span class="status-indicator ${d.state === 'ONLINE' ? 'ok' : 'degraded'}">${d.state}</span></td>
                <td class="font-mono">${d.read}</td>
                <td class="font-mono">${d.write}</td>
                <td class="font-mono">${d.cksum}</td>
              </tr>
            `).join('');
          }
          const ds = await callApi('/api/datasets');
          if (ds && ds.datasets) {
            const tbody = document.getElementById('storage-datasets-body');
            tbody.innerHTML = ds.datasets.map(d => `
              <tr>
                <td class="font-mono">${d.name}</td>
                <td class="font-mono">${d.used}</td>
                <td class="font-mono">${d.avail}</td>
                <td class="font-mono">${d.quota}</td>
                <td class="font-mono">${d.compression}</td>
                <td class="font-mono">${d.recordsize}</td>
                <td><button class="btn btn-sm" onclick="dispatchEditQuota('${d.name}')">Modificar cuota</button></td>
              </tr>
            `).join('');
          }
        }
    
        async function dispatchSimulateDiskFailure() {
          if (confirm('Acción requerida: Desasociar vdev disk2.img.\n\nEl pool tank operará en modo degradado mediante cálculo de paridad sin pérdida de datos.\n¿Desea continuar?')) {
            await callApi('/api/raid/action', 'POST', { action: 'offline_disk', target: 'disk2' });
            requestStorageMetrics();
            requestPublicStatus();
          }
        }
    
        async function dispatchRepairDisk() {
          await callApi('/api/raid/action', 'POST', { action: 'online_disk', target: 'disk2' });
          requestStorageMetrics();
          requestPublicStatus();
        }
    
        async function dispatchAddHotSpare() {
          await callApi('/api/raid/action', 'POST', { action: 'add_spare' });
          requestStorageMetrics();
        }
    
        async function dispatchScrub() {
          await callApi('/api/raid/action', 'POST', { action: 'scrub' });
          alert('Operación ZFS Scrub iniciada en segundo plano.');
        }
    
        async function dispatchEditQuota(ds) {
          const q = prompt('Indique el valor de cuota para ' + ds + ' (ejemplo: 10G, 25G):');
          if (q) {
            await callApi('/api/datasets', 'POST', { dataset: ds, property: 'quota', value: q });
            requestStorageMetrics();
          }
        }
    
        async function requestBackupMetrics() {
          const s = await callApi('/api/backups/snapshots');
          if (s && s.snapshots) {
            const tbody = document.getElementById('backups-snapshots-body');
            tbody.innerHTML = s.snapshots.map(x => `
              <tr>
                <td class="font-mono">${x.name}</td>
                <td class="font-mono">${x.used}</td>
                <td class="font-mono">${x.creation}</td>
                <td class="font-mono">${x.is_held ? 'HOLD (Activo)' : 'Libre'}</td>
                <td>
                  <button class="btn btn-sm btn-danger" onclick="dispatchRollback('${x.name}')">Rollback</button>
                  <button class="btn btn-sm" onclick="dispatchToggleHold('${x.name}', ${!x.is_held})">${x.is_held ? 'Liberar' : 'Bloquear'}</button>
                </td>
              </tr>
            `).join('');
          }
          const r2 = await callApi('/api/backups/r2');
          if (r2 && r2.r2_objects) {
            const tbody = document.getElementById('backups-r2-body');
            tbody.innerHTML = r2.r2_objects.map(o => `
              <tr>
                <td class="font-mono">${o.name}</td>
                <td class="font-mono">${o.size}</td>
                <td><button class="btn btn-sm" onclick="dispatchDrDrill()">Validar integridad</button></td>
              </tr>
            `).join('');
          }
        }
    
        async function dispatchCreateSnapshot() {
          const tag = prompt('Etiqueta para la instantánea (ejemplo: pre-mantenimiento):');
          if (tag) {
            await callApi('/api/backups/snapshot/create', 'POST', { tag });
            requestBackupMetrics();
          }
        }
    
        async function dispatchRollback(snapName) {
          if (confirm('ADVERTENCIA CRÍTICA:\n¿Revertir el dataset al punto ' + snapName + '?\n\nLos cambios posteriores a esta instantánea se descartarán.')) {
            await callApi('/api/backups/snapshot/rollback', 'POST', { snapshot: snapName });
            alert('Operación de rollback completada.');
          }
        }
    
        async function dispatchToggleHold(name, hold) {
          await callApi('/api/backups/snapshot/hold', 'POST', { snapshot: name, hold });
          requestBackupMetrics();
        }
    
        async function dispatchTriggerR2Backup() {
          await callApi('/api/backups/r2/trigger', 'POST', { mode: 'incremental' });
          alert('Trabajo de respaldo a Cloudflare R2 iniciado.');
        }
    
        async function dispatchDrDrill() {
          alert('Iniciando verificación de recuperación (DR Drill)...');
          const res = await callApi('/api/backups/r2/restore', 'POST', {});
          alert(res.output || 'Verificación completada.');
        }
    
        async function requestIdentityMetrics() {
          const u = await callApi('/api/users');
          if (u && u.users) {
            document.getElementById('identity-users-box').textContent = u.users;
          }
        }
    
        async function dispatchCreateUser() {
          const u = document.getElementById('input-username').value;
          const p = document.getElementById('input-password').value;
          if (u && p) {
            await callApi('/api/users/create', 'POST', { username: u, password: p });
            document.getElementById('input-username').value = '';
            document.getElementById('input-password').value = '';
            requestIdentityMetrics();
          }
        }
    
        async function dispatchImportCsv() {
          const csv = document.getElementById('input-csv').value;
          if (csv) {
            const res = await callApi('/api/users/csv-import', 'POST', { csv });
            document.getElementById('input-csv').value = '';
            requestIdentityMetrics();
          }
        }
    
        async function requestFilesystemMetrics(path = '') {
          const f = await callApi('/api/files?path=' + encodeURIComponent(path));
          if (f && f.entries) {
            document.getElementById('fs-current-path').textContent = f.path;
            const tbody = document.getElementById('fs-table-body');
            tbody.innerHTML = f.entries.map(e => `
              <tr>
                <td class="font-mono">${e.name}</td>
                <td>${e.is_dir ? 'Directorio' : 'Archivo'}</td>
                <td class="font-mono">${e.size}</td>
                <td class="font-mono">${e.date}</td>
                <td><button class="btn btn-sm btn-danger" onclick="dispatchDeleteFile('${f.path}/${e.name}')">Papelera</button></td>
              </tr>
            `).join('');
          }
        }
    
        async function dispatchDeleteFile(p) {
          if (confirm('¿Trasladar elemento a .Papelera:\n' + p + '?')) {
            await callApi('/api/files/delete', 'POST', { filepath: p });
            requestFilesystemMetrics();
          }
        }
    
        async function requestSecurityMetrics() {
          const s = await callApi('/api/security');
          if (s) {
            const statusEl = document.getElementById('security-shield-status');
            if (s.status === 1) {
              statusEl.textContent = 'NOMINAL';
              statusEl.style.color = 'var(--status-ok)';
            } else {
              statusEl.textContent = 'INCIDENTE DETECTADO';
              statusEl.style.color = 'var(--status-err)';
            }
            document.getElementById('security-threats-count').textContent = s.blocked_threats;
            document.getElementById('security-logs-box').textContent = s.logs;
          }
        }
    
        async function dispatchTestCanary() {
          await callApi('/api/security/test-canary', 'POST', {});
          alert('Simulación de alteración inyectada en canary_honeypot. El centinela registrará la amenaza.');
          setTimeout(requestSecurityMetrics, 2500);
        }
    
        async function requestServicesMetrics() {
          const s = await callApi('/api/services');
          if (s && s.pods) {
            const tbody = document.getElementById('services-table-body');
            tbody.innerHTML = s.pods.map(p => `
              <tr>
                <td class="font-mono">${p.name}</td>
                <td class="font-mono">${p.ready}</td>
                <td><span class="status-indicator ${p.status === 'Running' ? 'ok' : 'degraded'}">${p.status}</span></td>
                <td class="font-mono">${p.restarts}</td>
                <td><button class="btn btn-sm" onclick="dispatchViewLogs('${p.name}')">Logs</button></td>
              </tr>
            `).join('');
          }
        }
    
        async function dispatchViewLogs(pod) {
          const l = await callApi('/api/services/logs?pod=' + encodeURIComponent(pod));
          document.getElementById('logs-modal-title').textContent = 'Registro de pod: ' + pod;
          document.getElementById('logs-modal-content').textContent = l.logs || 'Sin registros disponibles.';
          document.getElementById('modal-logs').classList.add('active');
        }
    
        function closeLogsModal() {
          document.getElementById('modal-logs').classList.remove('active');
        }
    
        async function dispatchSmokeTests() {
          const logBox = document.getElementById('diagnostics-log-box');
          logBox.textContent = 'Ejecutando suite automatizada de pruebas...';
          const r = await callApi('/api/diagnostics/smoke-test', 'POST', {});
          logBox.textContent = r.log || 'Ejecución finalizada.';
        }
    
        async function dispatchDownloadReport() {
          const r = await callApi('/api/reports/executive');
          const blob = new Blob([r.report], { type: 'text/markdown' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'Reporte_Auditoria_Storage_' + Date.now() + '.md';
          a.click();
        }
    
        async function toggleWanAccess() {
          const wanBtn = document.getElementById('btn-wan-toggle');
          const isOnline = wanBtn.textContent.includes('Desconectar');
          const promptText = isOnline
            ? 'Confirmar aislamiento: Se interrumpirá el túnel público Cloudflare. El acceso estará restringido al segmento local.'
            : 'Confirmar habilitación: Se iniciará el túnel seguro hacia Cloudflare Zero-Trust.';
          if (confirm(promptText)) {
            wanBtn.textContent = 'Procesando...';
            const res = await callApi('/api/wan/toggle-lan', 'POST', {});
            if (res && res.message) alert(res.message);
            setTimeout(requestPublicStatus, 2500);
          }
        }
    
        async function rotateWanEndpoint() {
          if (confirm('Confirmar rotación: Se generará un nuevo endpoint público Cloudflare. Nextcloud y el código QR se actualizarán automáticamente.')) {
            await callApi('/api/wan/rotate-tunnel', 'POST', {});
            setTimeout(requestPublicStatus, 3500);
          }
        }
    
        async function dispatchFlushArc() {
          await callApi('/api/system/flush-arc', 'POST', {});
          requestSystemMetrics();
        }
    
        async function dispatchReboot() {
          if (confirm('Confirmar reinicio de sistema: Se terminarán las conexiones activas SMB y WebDAV.')) {
            await callApi('/api/system/reboot', 'POST', {});
          }
        }
    
        async function dispatchShutdown() {
          if (confirm('Confirmar detención de sistema: Se descargarán las transacciones a disco (zpool sync) antes de cortar la energía.')) {
            await callApi('/api/system/shutdown', 'POST', {});
          }
        }
    
        evaluateSession();
        setInterval(requestPublicStatus, 15000);
      </script>
    </body>
    </html>
