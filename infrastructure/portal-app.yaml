apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portal-qr
  namespace: argocd
spec:
  project: default
  source:
    repoURL: file:///home/$USER/nas-gitops
    targetRevision: HEAD
    path: apps/portal-qr
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
