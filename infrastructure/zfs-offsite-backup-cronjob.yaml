---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: zfs-offsite-backup
  namespace: kube-system
  labels:
    app.kubernetes.io/name: zfs-offsite-backup
    app.kubernetes.io/component: disaster-recovery
    app.kubernetes.io/part-of: nas-platform
spec:
  schedule: "0 3 * * *"
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: zfs-offsite-backup
        spec:
          hostPID: true
          containers:
          - name: r2-backup
            image: rclone/rclone@sha256:2687085f718d3c628f7fdfb77c52a1d344332aed543110bb88088f2c70d43eb5
            command: ["/bin/sh", "-c"]
            args:
            - |
              set -euo pipefail
              echo "============================================================"
              echo "[$(date -Iseconds)] INICIANDO BACKUP OFFSITE 3-2-1 (CLOUDFLARE R2)"
              echo "============================================================"

              if [ -z "${R2_ACCOUNT_ID:-}" ] || [ -z "${R2_ACCESS_KEY_ID:-}" ] || [ -z "${BACKUP_ENCRYPTION_KEY:-}" ]; then
                echo "[ERROR] Credenciales R2 o BACKUP_ENCRYPTION_KEY ausentes en el SealedSecret."
                exit 1
              fi

              export RCLONE_CONFIG_R2_TYPE="s3"
              export RCLONE_CONFIG_R2_PROVIDER="Cloudflare"
              export RCLONE_CONFIG_R2_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
              export RCLONE_CONFIG_R2_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
              export RCLONE_CONFIG_R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
              export RCLONE_CONFIG_R2_ACL="private"
              export RCLONE_CONFIG_R2_NO_CHECK_BUCKET="true"

              BUCKET="${R2_BUCKET_NAME:-nas-backup}"
              DATE_TAG=$(date +%Y%m%d-%H%M%S)
              DAY_OF_WEEK=$(date +%u)

              echo "[INFO] Localizando último snapshot FULL semanal base (ordenado por creación)..."
              BASE_FULL_SNAP=$(nsenter --target 1 --mount --uts --ipc --net --pid -- \
                zfs list -t snapshot -o name -s creation -H tank/nas 2>/dev/null | grep '^tank/nas@offsite-full-' | tail -n 1 || true)

              export BACKUP_ENCRYPTION_KEY

              if [ "$DAY_OF_WEEK" = "7" ] || [ -z "$BASE_FULL_SNAP" ]; then
                CURR_SNAP="tank/nas@offsite-full-${DATE_TAG}"
                REMOTE_OBJECT="r2:${BUCKET}/weekly/tank-full-${DATE_TAG}.zfs.enc"
                echo "[INFO] Creando snapshot base semanal: ${CURR_SNAP}..."
                nsenter --target 1 --mount --uts --ipc --net --pid -- zfs snapshot -r "$CURR_SNAP"

                echo "[INFO] Ejecutando FULL BACKUP SEMANAL (PBKDF2 600k iter + HMAC-SHA256): ${CURR_SNAP} -> ${REMOTE_OBJECT}"
                nsenter --target 1 --mount --uts --ipc --net --pid -- env BACKUP_ENCRYPTION_KEY="$BACKUP_ENCRYPTION_KEY" sh -c '
                  TMP_ENC="/tmp/nas-tunnel/offsite-stream.zfs.enc"
                  rm -f "$TMP_ENC" "${TMP_ENC}.hmac"
                  zfs send -c -R "$1" | openssl enc -aes-256-cbc -salt -pbkdf2 -iter 600000 -pass env:BACKUP_ENCRYPTION_KEY -out "$TMP_ENC"
                  openssl dgst -sha256 -hmac "$BACKUP_ENCRYPTION_KEY" -r "$TMP_ENC" | awk "{print \$1}" > "${TMP_ENC}.hmac"
                ' -- "$CURR_SNAP"
                rclone copyto "/tmp/nas-tunnel/offsite-stream.zfs.enc" "$REMOTE_OBJECT"
                rclone copyto "/tmp/nas-tunnel/offsite-stream.zfs.enc.hmac" "${REMOTE_OBJECT}.hmac"
                rm -f "/tmp/nas-tunnel/offsite-stream.zfs.enc" "/tmp/nas-tunnel/offsite-stream.zfs.enc.hmac"
              else
                BASE_TAG="${BASE_FULL_SNAP#tank/nas@offsite-full-}"
                CURR_SNAP="tank/nas@offsite-inc-${DATE_TAG}"
                REMOTE_OBJECT="r2:${BUCKET}/incremental/tank-diff-from-${BASE_TAG}-to-${DATE_TAG}.zfs.enc"
                echo "[INFO] Creando snapshot diferencial diario: ${CURR_SNAP} (base: ${BASE_FULL_SNAP})..."
                nsenter --target 1 --mount --uts --ipc --net --pid -- zfs snapshot -r "$CURR_SNAP"

                echo "[INFO] Ejecutando BACKUP DIFERENCIAL DIARIO (anclado a base semanal ${BASE_FULL_SNAP}) -> ${REMOTE_OBJECT}"
                nsenter --target 1 --mount --uts --ipc --net --pid -- env BACKUP_ENCRYPTION_KEY="$BACKUP_ENCRYPTION_KEY" sh -c '
                  TMP_ENC="/tmp/nas-tunnel/offsite-stream.zfs.enc"
                  rm -f "$TMP_ENC" "${TMP_ENC}.hmac"
                  zfs send -c -R -i "$1" "$2" | openssl enc -aes-256-cbc -salt -pbkdf2 -iter 600000 -pass env:BACKUP_ENCRYPTION_KEY -out "$TMP_ENC"
                  openssl dgst -sha256 -hmac "$BACKUP_ENCRYPTION_KEY" -r "$TMP_ENC" | awk "{print \$1}" > "${TMP_ENC}.hmac"
                ' -- "$BASE_FULL_SNAP" "$CURR_SNAP"
                rclone copyto "/tmp/nas-tunnel/offsite-stream.zfs.enc" "$REMOTE_OBJECT"
                rclone copyto "/tmp/nas-tunnel/offsite-stream.zfs.enc.hmac" "${REMOTE_OBJECT}.hmac"
                rm -f "/tmp/nas-tunnel/offsite-stream.zfs.enc" "/tmp/nas-tunnel/offsite-stream.zfs.enc.hmac"
              fi

              nsenter --target 1 --mount --uts --ipc --net --pid -- sh -c \
                'mkdir -p /tmp/nas-tunnel && date +%s > /tmp/nas-tunnel/last_offsite_backup_ts'

              echo "[INFO] Aplicando retención GFS segura (14d diferenciales, 35d semanales completos)..."
              rclone delete --min-age 14d "r2:$BUCKET/incremental/" 2>/dev/null || true
              rclone delete --min-age 35d "r2:$BUCKET/weekly/" 2>/dev/null || true

              nsenter --target 1 --mount --uts --ipc --net --pid -- sh -c '
                for ds in $(zfs list -r -H -o name tank/nas 2>/dev/null); do
                  zfs list -t snapshot -o name -s creation -H "$ds" 2>/dev/null | grep -E "^${ds}@offsite-inc-" | head -n -14 | while read -r s; do
                    [ -n "$s" ] || continue
                    zfs destroy "$s" 2>/dev/null || true
                  done
                  zfs list -t snapshot -o name -s creation -H "$ds" 2>/dev/null | grep -E "^${ds}@offsite-full-" | head -n -6 | while read -r s; do
                    [ -n "$s" ] || continue
                    zfs destroy "$s" 2>/dev/null || true
                  done
                done
              '

              echo "============================================================"
              echo "[$(date -Iseconds)] BACKUP OFFSITE COMPLETADO Y AUTENTICADO (HMAC-SHA256)"
              echo "============================================================"
            securityContext:
              privileged: true
            env:
            - name: R2_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: r2-backup-credentials
                  key: account-id
                  optional: true
            - name: R2_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: r2-backup-credentials
                  key: access-key-id
                  optional: true
            - name: R2_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: r2-backup-credentials
                  key: secret-access-key
                  optional: true
            - name: R2_BUCKET_NAME
              value: "nas-backup"
            - name: BACKUP_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: r2-backup-credentials
                  key: encryption-key
                  optional: true
            volumeMounts:
            - name: dev
              mountPath: /dev
            - name: zfs-config
              mountPath: /etc/zfs
            - name: tunnel-volume
              mountPath: /tmp/nas-tunnel
            resources:
              requests:
                cpu: "100m"
                memory: "128Mi"
              limits:
                cpu: "1000m"
                memory: "512Mi"
          restartPolicy: OnFailure
          volumes:
          - name: dev
            hostPath:
              path: /dev
          - name: zfs-config
            hostPath:
              path: /etc/zfs
          - name: tunnel-volume
            hostPath:
              path: /tmp/nas-tunnel
              type: DirectoryOrCreate
