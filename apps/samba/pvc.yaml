apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: samba-pvc
  namespace: default
  labels:
    app.kubernetes.io/name: samba
    app.kubernetes.io/part-of: nas-platform
spec:
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  volumeName: samba-pv
