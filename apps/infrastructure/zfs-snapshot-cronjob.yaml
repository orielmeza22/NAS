apiVersion: batch/v1
kind: CronJob
metadata:
  name: zfs-snapshot
  namespace: default
  labels:
    app: zfs-snapshot
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          hostPID: true
          containers:
          - name: zfs-snapshot
            image: ubuntu:22.04
            command: ["/bin/bash", "-c"]
            args:
            - |
              echo "Instalando herramientas ZFS..."
              apt-get update > /dev/null && apt-get install -y zfsutils-linux > /dev/null
              SNAPSHOT_NAME="tank/nas@k8s-auto-$(date +%Y%m%d-%H%M)"
              echo "Creando snapshot: $SNAPSHOT_NAME"
              zfs snapshot "$SNAPSHOT_NAME"
              echo "Snapshot creado con éxito."
            securityContext:
              privileged: true
            volumeMounts:
            - name: dev
              mountPath: /dev
            - name: zfs-config
              mountPath: /etc/zfs
          restartPolicy: OnFailure
          volumes:
          - name: dev
            hostPath:
              path: /dev
          - name: zfs-config
            hostPath:
              path: /etc/zfs
