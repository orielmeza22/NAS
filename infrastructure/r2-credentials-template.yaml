# Plantilla para Secret / SealedSecret de Cloudflare R2
# Para crear las credenciales en Cloudflare:
# 1. Ve a Cloudflare Dashboard -> R2 -> Manage R2 API Tokens
# 2. Crea un token con permisos "Object Read & Write"
# 3. Completa los valores abajo y sella el secreto con:
#    kubeseal -f r2-credentials.yaml -w sealed-r2-credentials.yaml
apiVersion: v1
kind: Secret
metadata:
  name: r2-backup-credentials
  namespace: kube-system
  labels:
    app.kubernetes.io/name: zfs-offsite-backup
    app.kubernetes.io/part-of: nas-platform
type: Opaque
stringData:
  account-id: "TU_CLOUDFLARE_ACCOUNT_ID"
  access-key-id: "TU_R2_ACCESS_KEY_ID"
  secret-access-key: "TU_R2_SECRET_ACCESS_KEY"
  encryption-key: "TuClaveMaestraDeCifradoAES2026!"
