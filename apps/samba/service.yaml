apiVersion: v1
kind: Service
metadata:
  name: samba
  labels:
    app.kubernetes.io/name: samba
    app.kubernetes.io/component: file-server
    app.kubernetes.io/part-of: nas-platform
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: samba
  ports:
    - name: smb
      port: 445
      targetPort: 445
      nodePort: 30445
      protocol: TCP
    - name: netbios-ns
      port: 137
      targetPort: 137
      nodePort: 30137
      protocol: UDP
    - name: netbios-dgm
      port: 138
      targetPort: 138
      nodePort: 30138
      protocol: UDP
    - name: netbios-ssn
      port: 139
      targetPort: 139
      nodePort: 30139
      protocol: TCP
