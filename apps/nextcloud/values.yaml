# Nextcloud Helm Chart Values
# Wrapper chart passing values to the official 'nextcloud' subchart dependency
nextcloud:
  image:
    repository: nextcloud
    tag: 35.0.1-apache
  nextcloud:
    host: localhost
    defaultConfigs:
      overrides.config.php: true
    configs:
      trusted-domains.config.php: |-
        <?php
        $CONFIG = array (
          'trusted_domains' => array (
            0 => 'localhost',
            1 => '127.0.0.1',
            2 => '10.0.2.15',
            3 => 'nas.escuela.local',
            4 => '*.trycloudflare.com',
          ),
        );
      redis-locking.config.php: |-
        <?php
        $CONFIG = array (
          'memcache.local' => '\OC\Memcache\APCu',
          'memcache.distributed' => '\OC\Memcache\Redis',
          'memcache.locking' => '\OC\Memcache\Redis',
          'redis' => array (
            'host' => 'nextcloud-redis.default.svc.cluster.local',
            'port' => 6379,
            'timeout' => 1.5,
          ),
        );
    extraEnv:
      - name: OVERWRITEPROTOCOL
        value: "https"
      - name: OVERWRITECLIURL
        value: "http://localhost"
      - name: TRUSTED_PROXIES
        value: "10.42.0.0/16 10.43.0.0/16 127.0.0.1 10.0.2.15"
      - name: REDIS_HOST
        value: "nextcloud-redis.default.svc.cluster.local"
      - name: REDIS_HOST_PORT
        value: "6379"
    existingSecret:
      enabled: true
      secretName: nextcloud-admin-credentials
      usernameKey: username
      passwordKey: password
  persistence:
    enabled: true
    existingClaim: nextcloud-pvc
  internalDatabase:
    enabled: false
  externalDatabase:
    enabled: true
    type: postgresql
    host: nextcloud-postgres.default.svc.cluster.local:5432
    database: nextcloud
    existingSecret:
      enabled: true
      secretName: nextcloud-admin-credentials
      usernameKey: username
      passwordKey: password
  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 5
  readinessProbe:
    enabled: true
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  startupProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
