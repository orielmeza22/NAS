# Nextcloud Helm Chart Values
# Wrapper chart passing values to the official 'nextcloud' subchart dependency
nextcloud:
  nextcloud:
    host: localhost
    defaultConfigs:
      overrides.config.php: true
    extraEnv:
      - name: NEXTCLOUD_TRUSTED_DOMAINS
        value: "localhost 127.0.0.1 10.0.2.15 *.trycloudflare.com *.loca.lt nas.escuela.local 10.42.0.0/16 10.43.0.0/16 *"
      - name: OVERWRITEPROTOCOL
        value: "https"
      - name: OVERWRITECLIURL
        value: "http://localhost"
      - name: TRUSTED_PROXIES
        value: "10.42.0.0/16 10.43.0.0/16 127.0.0.1 10.0.2.15"
    existingSecret:
      enabled: false
  persistence:
    enabled: true
    existingClaim: nextcloud-pvc
  internalDatabase:
    enabled: true
  livenessProbe:
    enabled: false
  readinessProbe:
    enabled: false
  startupProbe:
    enabled: false
