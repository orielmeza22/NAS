apiVersion: apps/v1
kind: Deployment
metadata:
  name: samba
  labels:
    app.kubernetes.io/name: samba
    app.kubernetes.io/component: file-server
    app.kubernetes.io/part-of: nas-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: samba
  template:
    metadata:
      labels:
        app.kubernetes.io/name: samba
        app.kubernetes.io/component: file-server
    spec:
      containers:
      - name: samba
        image: dperson/samba@sha256:66088b78a19810dd1457a8f39340e95e663c728083efa5fe7dc0d40b2478e869
        securityContext:
          privileged: false
          capabilities:
            add:
              - NET_ADMIN
              - SYS_ADMIN
              - DAC_OVERRIDE
              - CHOWN
              - FOWNER
              - SETUID
              - SETGID
            drop:
              - ALL
        ports:
        - containerPort: 445
          name: smb
        - containerPort: 137
          name: netbios-ns
          protocol: UDP
        - containerPort: 138
          name: netbios-dgm
          protocol: UDP
        - containerPort: 139
          name: netbios-ssn
        livenessProbe:
          tcpSocket:
            port: 445
          initialDelaySeconds: 30
          periodSeconds: 15
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 445
          initialDelaySeconds: 10
          periodSeconds: 10
        env:
        - name: TZ
          value: "America/Mexico_City"
        - name: WORKGROUP
          value: "ESCUELA"
        - name: USER_PROFESORES
          valueFrom:
            secretKeyRef:
              name: samba-credentials
              key: user-profesores
        - name: USER_ALUMNOS
          valueFrom:
            secretKeyRef:
              name: samba-credentials
              key: user-alumnos
        - name: USER_ADMIN
          valueFrom:
            secretKeyRef:
              name: samba-credentials
              key: user-admin
        args:
        - "-s"
        - "Profesores;/samba/profesores;yes;no;no;all;none;none"
        - "-s"
        - "Alumnos;/samba/alumnos;yes;no;no;all;none;none"
        - "-s"
        - "Compartido;/samba/compartido;yes;no;no;all;none;none"
        - "-s"
        - "Administracion;/samba/administracion;yes;no;no;all;none;none"
        - "-u"
        - "$(USER_PROFESORES)"
        - "-u"
        - "$(USER_ALUMNOS)"
        - "-u"
        - "$(USER_ADMIN)"
        volumeMounts:
        - name: samba-storage
          mountPath: /samba
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
      volumes:
      - name: samba-storage
        persistentVolumeClaim:
          claimName: samba-pvc
