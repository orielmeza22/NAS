apiVersion: v1
kind: PersistentVolume
metadata:
  name: nextcloud-pv
  labels:
    app.kubernetes.io/name: nextcloud
    app.kubernetes.io/part-of: nas-platform
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /tank/nas/nextcloud
  persistentVolumeReclaimPolicy: Retain
