        .nav-item:hover { background:rgba(255,255,255,0.04); color:var(--text); }
        .nav-item.active { background:var(--accent); color:#fff; font-weight:600; }
        .sidebar-footer { margin-top:auto; padding:16px; border-top:1px solid var(--border); font-size:11px; color:var(--text-muted); }
    
        /* CONTENT WRAPPER */
        .app-main { flex:1; display:flex; flex-direction:column; overflow-y:auto; min-width:0; }
        header { background:var(--bg-sidebar); border-bottom:1px solid var(--border); padding:14px 24px; display:flex; justify-content:space-between; align-items:center; }
        .header-status { display:flex; align-items:center; gap:12px; }
        .badge { font-size:11px; font-weight:600; padding:3px 8px; border-radius:4px; font-family:var(--font-mono); }
        .badge-ok { background:rgba(16,185,129,0.15); color:var(--success); border:1px solid var(--success); }
        .badge-warn { background:rgba(245,158,11,0.15); color:var(--warning); border:1px solid var(--warning); }
        
        .btn { background:var(--bg-card); color:var(--text); border:1px solid var(--border); padding:7px 14px; border-radius:6px; cursor:pointer; font-size:12px; font-weight:500; transition:all 0.15s; display:inline-flex; align-items:center; gap:6px; }
        .btn:hover { background:var(--bg-card-hover); border-color:#475569; }
        .btn-primary { background:var(--accent); border-color:var(--accent); color:#fff; }
        .btn-primary:hover { background:var(--accent-hover); }
        .btn-danger { background:#991b1b; border-color:#b91c1c; color:#fee2e2; }
        .btn-danger:hover { background:#b91c1c; }
        .btn-sm { padding:4px 8px; font-size:11px; border-radius:4px; }
    
        .content-body { padding:24px; max-width:1400px; width:100%; margin:0 auto; }
        .page-section { display:none; }
        .page-section.active { display:block; animation:fadeIn 0.15s ease-in; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }
    
        .section-header { margin-bottom:20px; }
        .section-title { font-size:18px; font-weight:700; color:#fff; }
        .section-subtitle { font-size:12px; color:var(--text-muted); margin-top:2px; }
    
        /* CARDS & GRIDS */
        .grid-3 { display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:16px; margin-bottom:20px; }
        .card { background:var(--bg-card); border:1px solid var(--border); border-radius:8px; padding:20px; margin-bottom:18px; }
        .card-header { font-size:13px; font-weight:700; color:#93c5fd; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; }
        
        .metric-value { font-size:26px; font-weight:700; color:#fff; line-height:1.2; margin:6px 0; }
        .metric-label { font-size:11px; color:var(--text-muted); }
    
        /* TABLES */
        .table-box { overflow-x:auto; border:1px solid var(--border); border-radius:6px; background:var(--bg-sidebar); }
        table { width:100%; border-collapse:collapse; text-align:left; }
        th { background:#1e293b; padding:10px 14px; font-size:11px; text-transform:uppercase; color:var(--text-muted); font-weight:600; border-bottom:1px solid var(--border); }
        td { padding:10px 14px; border-bottom:1px solid #1e293b; font-size:12px; }
        tr:hover td { background:rgba(255,255,255,0.02); }
    
        /* FORMS */
        .form-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:14px; margin-bottom:14px; }
        .form-group { margin-bottom:12px; }
        .form-label { display:block; font-size:11px; font-weight:600; margin-bottom:6px; color:var(--text-muted); }
        .form-control { width:100%; background:var(--bg-base); border:1px solid var(--border); border-radius:6px; padding:8px 12px; color:#fff; font-size:12px; transition:border-color 0.15s; }
        .form-control:focus { outline:none; border-color:var(--border-accent); }
    
        .terminal-window { background:#030712; border:1px solid var(--border); border-radius:8px; padding:16px; font-family:var(--font-mono); font-size:12px; color:#4ade80; min-height:280px; max-height:400px; overflow-y:auto; white-space:pre-wrap; }
    
        .toast { position:fixed; bottom:24px; right:24px; background:#1e293b; border:1px solid #475569; padding:12px 20px; border-radius:6px; color:#fff; font-size:12px; z-index:999; display:none; box-shadow:0 10px 25px -5px rgba(0,0,0,0.5); }
      </style>
    </head>
    <body>
    
      <!-- SIDEBAR NAVIGATION -->
      <aside>
        <div class="sidebar-brand">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
          <span>NAS Control Center</span>
        </div>
    
        <div class="nav-group">Monitoreo Principal</div>
        <div class="nav-item active" onclick="navigate('dashboard', this)">Dashboard Vivo</div>
        <div class="nav-item" onclick="navigate('services', this)">Microservicios K8s</div>
        <div class="nav-item" onclick="navigate('audit', this)">Auditoría Forense</div>
    
        <div class="nav-group">Almacenamiento & ZFS</div>
        <div class="nav-item" onclick="navigate('storage', this)">Discos & Pool tank</div>
        <div class="nav-item" onclick="navigate('datasets', this)">Datasets & Cuotas</div>
        <div class="nav-item" onclick="navigate('files', this)">Explorador Archivos</div>
    
        <div class="nav-group">Identidad & Red</div>
        <div class="nav-item" onclick="navigate('users', this)">Usuarios & Claves</div>
        <div class="nav-item" onclick="navigate('samba', this)">Recursos SMB</div>
        <div class="nav-item" onclick="navigate('network', this)">Red & Rollback</div>
    
        <div class="nav-group">Seguridad & Desastres</div>
        <div class="nav-item" onclick="navigate('snapshots', this)">Snapshots & Reversión</div>
        <div class="nav-item" onclick="navigate('r2', this)">Cloudflare R2 & Kit</div>
        <div class="nav-item" onclick="navigate('dr', this)">Simulacro DR (RTO)</div>
        <div class="nav-item" onclick="navigate('ups', this)">Energía & UPS (NUT)</div>
    
        <div class="nav-group">Herramientas Avanzadas</div>
        <div class="nav-item" onclick="navigate('shell', this)">Terminal de Rescate</div>
        <div class="nav-item" onclick="navigate('pki', this)">Certificados PKI</div>
        <div class="nav-item" onclick="navigate('nextcloud', this)">Mantenimiento occ</div>
        <div class="nav-item" onclick="navigate('cron', this)">Tareas Periódicas</div>
    
        <div class="sidebar-footer">
          <div>Enterprise Appliance v2.0</div>
          <div style="color:#64748b; margin-top:2px;">Debian + OpenZFS + K3s</div>
        </div>
      </aside>
    
      <!-- MAIN VIEW -->
      <div class="app-main">
        <header>
          <div class="header-status">
            <span class="badge badge-ok" id="live-badge-pool">ZFS: ONLINE</span>
            <span class="badge badge-ok" id="live-badge-telemetry">TELEMETRÍA EN VIVO</span>
          </div>
          <div style="display:flex; gap:10px; align-items:center;">
            <button class="btn btn-danger btn-sm" onclick="confirmPower('reboot')">Reiniciar Host</button>
            <button class="btn btn-danger btn-sm" onclick="confirmPower('poweroff')">Apagar Host</button>
          </div>
        </header>
    
        <div class="content-body">
    
          <!-- 1. DASHBOARD -->
          <section id="sec-dashboard" class="page-section active">
            <div class="section-header">
              <div class="section-title">Dashboard Vivo del Servidor</div>
              <div class="section-subtitle">Telemetría operativa leída en tiempo real desde el kernel y OpenZFS</div>
            </div>
            <div class="grid-3">
              <div class="card">
                <div class="metric-label">Carga CPU (1m, 5m, 15m)</div>
                <div class="metric-value" id="dash-cpu-load" style="color:#60a5fa;">--</div>
                <div class="metric-label">Procesos activos del sistema</div>
              </div>
              <div class="card">
                <div class="metric-label">Memoria RAM Física</div>
                <div class="metric-value" id="dash-ram-usage" style="color:#34d399;">--</div>
                <div class="metric-label" id="dash-ram-sub">Leyendo /proc/meminfo...</div>
              </div>
              <div class="card">
                <div class="metric-label">Estado del Pool ZFS (tank)</div>
                <div class="metric-value" id="dash-pool-state" style="color:#a78bfa;">ONLINE</div>
                <div class="metric-label">RAID-Z1 con compresión LZ4</div>
              </div>
            </div>
    
            <div class="card">
              <div class="card-header">Topología OpenZFS (Salida en vivo de zpool status)</div>
              <pre id="dash-zpool-output" style="font-family:var(--font-mono); font-size:12px; color:#cbd5e1; background:var(--bg-base); padding:14px; border-radius:6px; overflow-x:auto;">Consultando pool tank...</pre>
            </div>
          </section>
    
          <!-- 2. STORAGE -->
          <section id="sec-storage" class="page-section">
            <div class="section-header">
              <div class="section-title">Discos Físicos & Pool ZFS</div>
              <div class="section-subtitle">Detección de hardware en vivo mediante lsblk y control de mantenimiento</div>
            </div>
            <div class="card">
              <div class="card-header">
                <span>Discos Físicos Detectados en el Host</span>
                <div>
                  <button class="btn btn-primary btn-sm" onclick="execCmd('zfs.scrub', {subaction:'start'})">Iniciar Scrub</button>
                  <button class="btn btn-sm" onclick="execCmd('zfs.scrub', {subaction:'stop'})">Detener Scrub</button>
                </div>
              </div>
              <div class="table-box">
                <table>
                  <thead><tr><th>Dispositivo</th><th>Tipo</th><th>Tamaño</th><th>Modelo</th><th>Montaje</th><th>Diagnóstico</th></tr></thead>
                  <tbody id="tbl-disks"><tr><td colspan="6">Leyendo dispositivos de bloques...</td></tr></tbody>
                </table>
              </div>
            </div>
    
            <div class="card">
              <div class="card-header">Reemplazo Asistido de Disco Dañado</div>
              <div class="form-grid">
                <div class="form-group"><label class="form-label">Disco a Reemplazar (ej. /zfs-disks/disk2.img)</label><input type="text" id="in-rep-old" class="form-control"></div>
                <div class="form-group"><label class="form-label">Nuevo Disco Físico (ej. /dev/disk/by-id/...)</label><input type="text" id="in-rep-new" class="form-control"></div>
              </div>
              <button class="btn btn-primary" onclick="execDiskReplace()">Ejecutar zpool replace y Reconstrucción</button>
            </div>
          </section>
    
          <!-- 3. DATASETS -->
          <section id="sec-datasets" class="page-section">
            <div class="section-header">
              <div class="section-title">Datasets OpenZFS & Límites de Cuotas</div>
              <div class="section-subtitle">Configuración granular del almacenamiento por departamento o rol</div>
            </div>
            <div class="card">
              <div class="table-box">
                <table>
                  <thead><tr><th>Dataset</th><th>Descripción</th><th>Cuota Asignada</th><th>Acción</th></tr></thead>
                  <tbody>
                    <tr><td><code>tank/nas/alumnos</code></td><td>Espacio de trabajo y carpetas personales de alumnos</td><td><input type="text" id="q-alumnos" class="form-control" style="width:120px;" value="10G"></td><td><button class="btn btn-primary btn-sm" onclick="saveQuota('tank/nas/alumnos', 'q-alumnos')">Actualizar Cuota</button></td></tr>
                    <tr><td><code>tank/nas/profesores</code></td><td>Carpetas de planificación y material docente</td><td><input type="text" id="q-profesores" class="form-control" style="width:120px;" value="100G"></td><td><button class="btn btn-primary btn-sm" onclick="saveQuota('tank/nas/profesores', 'q-profesores')">Actualizar Cuota</button></td></tr>
                    <tr><td><code>tank/nas/publico</code></td><td>Recursos y normativas compartidas institucionales</td><td><input type="text" id="q-publico" class="form-control" style="width:120px;" value="50G"></td><td><button class="btn btn-primary btn-sm" onclick="saveQuota('tank/nas/publico', 'q-publico')">Actualizar Cuota</button></td></tr>
                    <tr><td><code>tank/nas/nextcloud</code></td><td>Almacenamiento transaccional de Nextcloud Hub</td><td><input type="text" id="q-nextcloud" class="form-control" style="width:120px;" value="500G"></td><td><button class="btn btn-primary btn-sm" onclick="saveQuota('tank/nas/nextcloud', 'q-nextcloud')">Actualizar Cuota</button></td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          </section>
    
          <!-- 4. USUARIOS -->
          <section id="sec-users" class="page-section">
            <div class="section-header">
              <div class="section-title">Identidad & Usuarios Escolares</div>
              <div class="section-subtitle">Alta y reseteo sincronizado automáticamente en Samba y Nextcloud</div>
            </div>
            <div class="card">
              <div class="card-header">Alta de Nuevo Usuario</div>
              <div class="form-grid">
                <div class="form-group"><label class="form-label">Usuario (ej. docente.garcia)</label><input type="text" id="usr-name" class="form-control"></div>
                <div class="form-group"><label class="form-label">Nombre Completo</label><input type="text" id="usr-disp" class="form-control"></div>
                <div class="form-group"><label class="form-label">Contraseña</label><input type="password" id="usr-pass" class="form-control"></div>
                <div class="form-group"><label class="form-label">Grupo</label>
                  <select id="usr-group" class="form-control">
                    <option value="alumnos">Alumnos</option>
                    <option value="profesores">Profesores</option>
                    <option value="directivos">Directivos</option>
                  </select>
                </div>
              </div>
              <button class="btn btn-primary" onclick="createUserSubmit()">Crear y Sincronizar Cuenta</button>
            </div>
    
            <div class="card">
              <div class="card-header">Reseteo Rápido de Contraseña Olvidada</div>
              <div class="form-grid">
                <div class="form-group"><label class="form-label">Nombre de Usuario</label><input type="text" id="rst-name" class="form-control"></div>
                <div class="form-group"><label class="form-label">Nueva Contraseña</label><input type="password" id="rst-pass" class="form-control"></div>
              </div>
              <button class="btn btn-primary" onclick="resetUserSubmit()">Guardar Nueva Contraseña</button>
            </div>
          </section>
    
          <!-- 5. SAMBA -->
          <section id="sec-samba" class="page-section">
            <div class="section-header">
              <div class="section-title">Recursos Compartidos de Red (Samba SMB)</div>
              <div class="section-subtitle">Shares institucionales con aislamiento de alumnos y papelera de reciclaje</div>
            </div>
            <div class="card">
              <div class="table-box">
                <table>
                  <thead><tr><th>Recurso</th><th>Ruta en Almacenamiento</th><th>Permisos & Aislamiento</th><th>Papelera Red</th><th>Estado</th></tr></thead>
                  <tbody>
                    <tr><td><code>[mi-espacio]</code></td><td>/samba/alumnos/%U</td><td>Aislamiento Privado por Alumno (Máscara 0700)</td><td>Habilitada (.recycle)</td><td><span class="badge badge-ok">ACTIVO</span></td></tr>
                    <tr><td><code>[entregas]</code></td><td>/samba/alumnos/entregas</td><td>Buzón de Tareas (Escritura Alumnos / Lectura Docentes)</td><td>Deshabilitada</td><td><span class="badge badge-ok">ACTIVO</span></td></tr>
                    <tr><td><code>[profesores]</code></td><td>/samba/profesores</td><td>Exclusivo Docentes y Administradores</td><td>Habilitada (.recycle)</td><td><span class="badge badge-ok">ACTIVO</span></td></tr>
                    <tr><td><code>[publico]</code></td><td>/samba/publico</td><td>Lectura Todos los Miembros de la Escuela</td><td>Deshabilitada</td><td><span class="badge badge-ok">ACTIVO</span></td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          </section>
    
          <!-- 6. SNAPSHOTS -->
          <section id="sec-snapshots" class="page-section">
            <div class="section-header">
              <div class="section-title">Snapshots OpenZFS & Reversión Coordinada</div>
              <div class="section-subtitle">Puntos de restauración atómicos para mitigar corrupción o ataques de ransomware</div>
            </div>
            <div class="card">
              <div class="card-header">
                <span>Crear Snapshot Atómico Inmediato</span>
              </div>
              <div style="display:flex; gap:10px; margin-bottom:14px;">
                <input type="text" id="new-snap-tag" class="form-control" placeholder="Etiqueta (ej. pre-actualizacion)..." style="max-width:300px;">
                <button class="btn btn-primary" onclick="createSnapSubmit()">Crear Snapshot</button>
              </div>
              <div class="table-box">
                <table>
                  <thead><tr><th>Snapshot Tag</th><th>Espacio Referenciado</th><th>Acción</th></tr></thead>
                  <tbody id="tbl-snapshots"><tr><td colspan="3">Cargando snapshots...</td></tr></tbody>
                </table>
              </div>
            </div>
          </section>
    
          <!-- 7. R2 & EMERGENCY KIT -->
          <section id="sec-r2" class="page-section">
            <div class="section-header">
              <div class="section-title">Respaldo Offsite en Cloudflare R2 & Kit de Emergencia</div>
              <div class="section-subtitle">Cumplimiento 3-2-1 con inmutabilidad WORM y claves maestras para recuperación total</div>
            </div>
            <div class="grid-3">
              <div class="card">
                <div class="card-header">Copia Externa Cloudflare R2 (WORM)</div>
                <p style="color:var(--text-muted); font-size:12px; margin-bottom:14px;">Streaming directo cifrado con AES-256-CBC PBKDF2 y Object Lock por 30 días.</p>
                <button class="btn btn-primary" onclick="execCmd('backup.r2.trigger', {})">Disparar Backup a la Nube Ahora</button>
              </div>
              <div class="card">
                <div class="card-header">Emergency Kit de Rescate Bare-Metal</div>
                <p style="color:var(--text-muted); font-size:12px; margin-bottom:14px;">Descargue el archivo .tar.enc con las claves de cifrado, Sealed Secrets y configuración.</p>
                <button class="btn btn-primary" onclick="execCmd('backup.export_emergency_kit', {})">Exportar Emergency Kit</button>
              </div>
            </div>
          </section>
    
          <!-- 8. SERVICIOS -->
          <section id="sec-services" class="page-section">
            <div class="section-header">
              <div class="section-title">Estado de Microservicios Orquestados</div>
              <div class="section-subtitle">Monitoreo de disponibilidad de los contenedores K3s del appliance</div>
            </div>
            <div class="card">
              <div class="table-box">
                <table>
                  <thead><tr><th>Servicio</th><th>Namespace</th><th>Estado</th><th>Reinicio Controlado</th></tr></thead>
                  <tbody>
                    <tr><td><code>nextcloud</code> (Cloud & WebDAV)</td><td>default</td><td><span class="badge badge-ok">1/1 RUNNING</span></td><td><button class="btn btn-sm" onclick="execCmd('services.restart', {service:'nextcloud', namespace:'default'})">Reiniciar</button></td></tr>
                    <tr><td><code>samba</code> (Servidor SMB/CIFS)</td><td>default</td><td><span class="badge badge-ok">1/1 RUNNING</span></td><td><button class="btn btn-sm" onclick="execCmd('services.restart', {service:'samba', namespace:'default'})">Reiniciar</button></td></tr>
                    <tr><td><code>nextcloud-postgres</code> (PostgreSQL 16)</td><td>default</td><td><span class="badge badge-ok">1/1 RUNNING</span></td><td><button class="btn btn-sm" onclick="execCmd('services.restart', {service:'nextcloud-postgres', namespace:'default'})">Reiniciar</button></td></tr>
                    <tr><td><code>ransomware-sentinel</code> (Escudo Honeypot)</td><td>kube-system</td><td><span class="badge badge-ok">1/1 RUNNING</span></td><td><button class="btn btn-sm" onclick="execCmd('services.restart', {service:'ransomware-sentinel', namespace:'kube-system'})">Reiniciar</button></td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          </section>
    
          <!-- 9. WEB SHELL -->
          <section id="sec-shell" class="page-section">
            <div class="section-header">
              <div class="section-title">Terminal de Rescate Web</div>
              <div class="section-subtitle">Consola de mantenimiento directo con auditoría inmutable en tiempo real</div>
            </div>
            <div class="card">
              <div style="display:flex; gap:10px; margin-bottom:12px;">
                <input type="text" id="sh-input" class="form-control" placeholder="Escriba un comando (ej. zpool status, lsblk, df -h, uptime)..." onkeydown="if(event.key==='Enter') runShell()">
                <button class="btn btn-primary" onclick="runShell()">Ejecutar</button>
              </div>
              <div class="terminal-window" id="sh-output"># Terminal de rescate inicializada.
    # Todas las acciones se registran con firma inmutable en /var/log/nas-agentd-audit.log
    $ </div>
            </div>
          </section>
    
          <!-- 10. EXPLORADOR ARCHIVOS -->
          <section id="sec-files" class="page-section">
            <div class="section-header">
              <div class="section-title">Explorador de Almacenamiento ZFS</div>
              <div class="section-subtitle">Navegación en vivo por datasets institucionales y papelera de red</div>
            </div>
            <div class="card">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <div style="font-family:var(--font-mono); font-size:12px;">Ruta actual: <strong id="cur-dir-path">/tank/nas</strong></div>
                <div>
                  <button class="btn btn-sm" onclick="loadDirectory('/tank/nas')">Raíz (/tank/nas)</button>
                  <button class="btn btn-sm" onclick="loadDirectory('/tank/nas/.recycle')">Papelera (.recycle)</button>
                </div>
              </div>
              <div class="table-box">
                <table>
                  <thead><tr><th>Nombre</th><th>Tipo</th><th>Tamaño</th><th>Modificado</th><th>Navegar</th></tr></thead>
                  <tbody id="tbl-files"><tr><td colspan="5">Cargando directorio...</td></tr></tbody>
                </table>
              </div>
            </div>
          </section>
    
          <!-- 11. RED -->
          <section id="sec-network" class="page-section">
            <div class="section-header">
              <div class="section-title">Configuración de Red & Auto-Rollback</div>
              <div class="section-subtitle">Ventana de seguridad de 60 segundos para evitar pérdida de acceso al servidor</div>
            </div>
            <div class="card">
              <div class="form-grid">
                <div class="form-group"><label class="form-label">Dirección IP Estática (CIDR)</label><input type="text" id="net-ip" class="form-control" value="192.168.1.100/24"></div>
                <div class="form-group"><label class="form-label">Puerta de Enlace (Gateway)</label><input type="text" id="net-gw" class="form-control" value="192.168.1.1"></div>
              </div>
              <button class="btn btn-primary" onclick="execCmd('network.apply', {ip:document.getElementById('net-ip').value, gateway:document.getElementById('net-gw').value})">Aplicar con Ventana de Prueba (60s)</button>
              <button class="btn btn-primary" style="background:#059669; border-color:#059669; margin-left:8px;" onclick="execCmd('network.confirm', {})">Confirmar Definitivamente</button>
            </div>
          </section>
    
          <!-- 12. UPS -->
          <section id="sec-ups" class="page-section">
            <div class="section-header">
              <div class="section-title">Energía & Monitoreo de SAI / UPS (NUT)</div>
              <div class="section-subtitle">Protección contra cortes abruptos de luz y apagado ordenado del RAID</div>
            </div>
            <div class="card">
              <div class="metric-label">Carga de Batería</div>
              <div class="metric-value" style="color:#34d399;">100% (Online)</div>
              <div style="font-size:12px; color:var(--text-muted); margin-top:10px;">Autonomía estimada: 48 minutos. Voltaje: 228.4 V AC.</div>
            </div>
          </section>
    
          <!-- 13. PKI -->
          <section id="sec-pki" class="page-section">
            <div class="section-header">
              <div class="section-title">Certificados TLS & Autoridad Certificadora (PKI)</div>
              <div class="section-subtitle">Eliminación de advertencias de 'Sitio No Seguro' en la red escolar</div>
            </div>
            <div class="card">
              <p style="color:var(--text-muted); font-size:12px; margin-bottom:14px;">Genere una CA Raíz Institucional para distribuir e instalar en los navegadores de las aulas.</p>
              <button class="btn btn-primary" onclick="execCmd('pki.generate_ca', {})">Generar / Renovar CA Raíz</button>
            </div>
          </section>
    
          <!-- 14. NEXTCLOUD -->
          <section id="sec-nextcloud" class="page-section">
            <div class="section-header">
              <div class="section-title">Mantenimiento de Nextcloud & PostgreSQL</div>
              <div class="section-subtitle">Comandos de optimización y re-escaneo de archivos en 1 clic</div>
            </div>
            <div class="card">
              <div style="display:flex; gap:10px;">
                <button class="btn btn-primary" onclick="execCmd('occ.files_scan', {})">Re-indexar Archivos (occ files:scan --all)</button>
                <button class="btn" onclick="execCmd('postgres.vacuum', {})">Ejecutar VACUUM ANALYZE en PostgreSQL</button>
              </div>
            </div>
          </section>
    
          <!-- 15. CRON -->
          <section id="sec-cron" class="page-section">
            <div class="section-header">
              <div class="section-title">Tareas Automáticas Programadas (CronJobs)</div>
              <div class="section-subtitle">Disparo manual y visualización de frecuencias de respaldo y mantenimiento</div>
            </div>
            <div class="card">
              <div class="table-box">
                <table>
                  <thead><tr><th>Tarea</th><th>Frecuencia</th><th>Disparo Inmediato</th></tr></thead>
                  <tbody>
                    <tr><td><code>zfs-snapshot</code></td><td>Cada 1 hora</td><td><button class="btn btn-sm" onclick="execCmd('zfs.snapshot.create', {tag:'manual-'+Date.now()})">Lanzar Ahora</button></td></tr>
                    <tr><td><code>zfs-offsite-backup</code></td><td>Diario a las 02:00</td><td><button class="btn btn-sm" onclick="execCmd('backup.r2.trigger', {})">Lanzar Ahora</button></td></tr>
                    <tr><td><code>zfs-scrub</code></td><td>Mensual (Día 1 a las 03:00)</td><td><button class="btn btn-sm" onclick="execCmd('zfs.scrub', {subaction:'start'})">Lanzar Ahora</button></td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          </section>
    
          <!-- 16. DR DRILL -->
          <section id="sec-dr" class="page-section">
            <div class="section-header">
              <div class="section-title">Simulacro de Contingencia (DR Drill & RTO Real)</div>
              <div class="section-subtitle">Validación práctica y cronometrada de la recuperación ante desastres</div>
            </div>
            <div class="card">
              <p style="color:var(--text-muted); font-size:12px; margin-bottom:14px;">Ejecuta un ciclo de recuperación real sobre un dataset aislado y valida las sumas SHA-256.</p>
              <button class="btn btn-primary" onclick="runDrillTest()">Iniciar Simulacro DR</button>
              <div id="dr-result-box" style="margin-top:14px; font-weight:600; color:#34d399;"></div>
            </div>
          </section>
    
          <!-- 17. AUDITORIA -->
          <section id="sec-audit" class="page-section">
            <div class="section-header">
              <div class="section-title">Bitácora Forense de Auditoría</div>
              <div class="section-subtitle">Registro append-only en /var/log/nas-agentd-audit.log</div>
            </div>
            <div class="card">
              <div class="terminal-window" style="color:#94a3b8;" id="audit-log-view">[AUDIT] Sistema en línea. Todas las llamadas administrativas quedan firmadas.</div>
            </div>
          </section>
    
        </div>
      </div>
    
      <div id="toast" class="toast"></div>
    
      <script>
        // Tab Navigation
        function navigate(secId, btn) {
          document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
          document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
          const target = document.getElementById('sec-' + secId);
          if (target) target.classList.add('active');
          if (btn) btn.classList.add('active');
        }
    
        function showToast(msg) {
          const el = document.getElementById('toast');
          el.innerText = msg;
          el.style.display = 'block';
          setTimeout(() => { el.style.display = 'none'; }, 4000);
        }
    
        // Backend Execution
        async function execCmd(action, params) {
          try {
            const res = await fetch('/api/agent/action', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({action: action, params: params || {}})
            });
            const data = await res.json();
            showToast('Acción ' + action + (data.success ? ' completada con éxito' : ' falló'));
            return data;
          } catch (err) {
            showToast('Error de conexión: ' + err.message);
          }
        }
    
        // Telemetry Polling (Every 3 seconds)
        async function pollTelemetry() {
          try {
            const res = await execCmd('system.status', {});
            if (res && res.data) {
              const l = res.data.loadavg || [0, 0, 0];
              document.getElementById('dash-cpu-load').innerText = l[0].toFixed(2) + ', ' + l[1].toFixed(2) + ', ' + l[2].toFixed(2);
              if (res.data.mem) {
                const tot = parseInt(res.data.mem.MemTotal || '0');
                const avail = parseInt(res.data.mem.MemAvailable || '0');
                const used = tot - avail;
                const pct = Math.round((used / tot) * 100);
                document.getElementById('dash-ram-usage').innerText = (used/1048576).toFixed(1) + ' GB (' + pct + '%)';
                document.getElementById('dash-ram-sub').innerText = 'Total: ' + (tot/1048576).toFixed(1) + ' GB | Libre: ' + (avail/1048576).toFixed(1) + ' GB';
              }
            }
    
            const zfsRes = await execCmd('zfs.pool.status', {});
            if (zfsRes && zfsRes.data && zfsRes.data.stdout) {
              document.getElementById('dash-zpool-output').innerText = zfsRes.data.stdout;
              const isOk = zfsRes.data.stdout.includes('state: ONLINE');
              document.getElementById('live-badge-pool').innerText = isOk ? 'ZFS: ONLINE' : 'ZFS: DEGRADED';
              document.getElementById('live-badge-pool').className = isOk ? 'badge badge-ok' : 'badge badge-warn';
              document.getElementById('dash-pool-state').innerText = isOk ? 'ONLINE' : 'DEGRADED';
            }
          } catch (e) {}
        }
    
        // Load Disks via lsblk
        async function loadDisksView() {
          const res = await execCmd('storage.disks.list', {});
          const tbody = document.getElementById('tbl-disks');
          if (res && res.data && res.data.blockdevices) {
            tbody.innerHTML = '';
            res.data.blockdevices.forEach(d => {
              const tr = document.createElement('tr');
              tr.innerHTML = '<td><code>/dev/' + d.name + '</code></td><td>' + d.type + '</td><td>' + d.size + '</td><td>' + (d.model || 'Standard Device') + '</td><td>' + (d.mountpoint || '--') + '</td><td><button class="btn btn-sm" onclick="execCmd(\'storage.smart.test\', {device:\'/dev/' + d.name + '\', type:\'short\'})">Test SMART</button></td>';
              tbody.appendChild(tr);
            });
          }
        }
    
        // Load Files
        async function loadDirectory(path) {
          document.getElementById('cur-dir-path').innerText = path;
          const res = await execCmd('files.list_all', {path: path});
          const tbody = document.getElementById('tbl-files');
          tbody.innerHTML = '';
          if (res && res.data && res.data.items) {
            res.data.items.forEach(it => {
              const tr = document.createElement('tr');
              const isD = it.is_dir;
              tr.innerHTML = '<td><code>' + it.name + '</code></td><td>' + (isD ? 'Carpeta' : 'Archivo') + '</td><td>' + (isD ? '--' : (it.size/1024).toFixed(1) + ' KB') + '</td><td>' + new Date(it.mtime * 1000).toLocaleString() + '</td><td>' + (isD ? '<button class="btn btn-sm" onclick="loadDirectory(\'' + path + '/' + it.name + '\')">Abrir</button>' : '--') + '</td>';
              tbody.appendChild(tr);
            });
          }
        }
    
        async function createUserSubmit() {
          const u = document.getElementById('usr-name').value;
          const d = document.getElementById('usr-disp').value || u;
          const p = document.getElementById('usr-pass').value;
          const g = document.getElementById('usr-group').value;
          if (!u || !p) return alert('Complete usuario y clave');
          showToast('Sincronizando cuenta en Nextcloud y Samba...');
          await execCmd('users.sync_nextcloud', {username:u, display_name:d, password:p, group:g});
        }
    
        async function resetUserSubmit() {
          const u = document.getElementById('rst-name').value;
          const p = document.getElementById('rst-pass').value;
          if (!u || !p) return alert('Complete usuario y nueva clave');
          await execCmd('users.reset_password', {username:u, password:p});
        }
    
        async function saveQuota(dataset, inputId) {
          const q = document.getElementById(inputId).value;
          await execCmd('zfs.quota.set', {dataset: dataset, quota: q});
        }
    
        async function createSnapSubmit() {
          const tag = document.getElementById('new-snap-tag').value || 'snap-' + Date.now();
          await execCmd('zfs.snapshot.create', {dataset:'tank/nas', tag: tag});
        }
    
        async function runShell() {
          const input = document.getElementById('sh-input');
          const cmd = input.value.trim();
          if (!cmd) return;
          input.value = '';
          const box = document.getElementById('sh-output');
          box.innerText += '\n$ ' + cmd + '\n';
          const res = await execCmd('shell.exec', {cmd: cmd});
          if (res && res.data) {
            box.innerText += res.data.stdout || res.data.stderr || '(Salida vacía, código ' + res.data.exit_code + ')';
          }
          box.scrollTop = box.scrollHeight;
        }
    
        async function runDrillTest() {
          document.getElementById('dr-result-box').innerText = 'Ejecutando simulación de contingencia...';
          const res = await execCmd('dr.run_drill', {});
          if (res && res.data) {
            document.getElementById('dr-result-box').innerText = 'Simulacro exitoso. RTO Real medido: ' + res.data.rto_seconds + 's. Checksums SHA-256 validados.';
          }
        }
    
        function confirmPower(action) {
          if (confirm('¿Está seguro de ' + (action === 'reboot' ? 'REINICIAR' : 'APAGAR') + ' el servidor NAS?')) {
            execCmd('system.power', {command: action});
          }
        }
    
        window.onload = function() {
          pollTelemetry();
          loadDisksView();
          loadDirectory('/tank/nas');
          setInterval(pollTelemetry, 3000);
        };
      </script>
    </body>
    </html>
