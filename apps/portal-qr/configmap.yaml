apiVersion: v1
kind: ConfigMap
metadata:
  name: portal-qr-config
  namespace: default
  labels:
    app.kubernetes.io/name: portal-qr
    app.kubernetes.io/part-of: nas-platform
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>NAS Escuela - Acceso</title>
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                text-align: center;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: #fff;
                padding: 20px;
            }
            h1 { font-size: 2.2em; margin-bottom: 0.3em; }
            .subtitle { font-size: 1.1em; opacity: 0.9; margin-bottom: 1.5em; }
            .qr-card {
                padding: 24px;
                background: white;
                border-radius: 20px;
                box-shadow: 0 20px 40px rgba(0,0,0,0.25);
                margin-bottom: 1.5em;
                color: #333;
                max-width: 340px;
            }
            .qr-card img { display: block; width: 250px; height: 250px; margin: 0 auto 12px; }
            .url-link {
                display: inline-block;
                word-break: break-all;
                color: #667eea;
                font-weight: 600;
                text-decoration: none;
                font-size: 0.9em;
                padding: 8px 12px;
                background: #f0f4ff;
                border-radius: 8px;
            }
            .url-link:hover { text-decoration: underline; }
            .footer { font-size: 0.85em; opacity: 0.75; margin-top: 1em; }
        </style>
    </head>
    <body>
        <h1>&#128218; NAS Escolar</h1>
        <p class="subtitle">Escanea el código QR con tu celular para acceder a Nextcloud</p>
        <div class="qr-card">
            <img id="qr-img" src="" alt="Cargando QR Nextcloud...">
            <a id="qr-link" class="url-link" href="#" target="_blank">Detectando túnel activo...</a>
        </div>
        <p class="footer">Infraestructura Zero-Trust Cloudflare + K3s + ArgoCD</p>
        <script>
            async function loadTunnelUrl() {
                try {
                    const res = await fetch('/tunnel/url.txt?t=' + Date.now(), { cache: 'no-store' });
                    if (res.ok) {
                        const url = (await res.text()).trim();
                        if (url.startsWith('http')) {
                            document.getElementById('qr-img').src =
                                'https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=' + encodeURIComponent(url);
                            const link = document.getElementById('qr-link');
                            link.href = url;
                            link.textContent = url;
                        }
                    }
                } catch (e) {
                    console.error('Error leyendo URL del túnel:', e);
                }
            }
            loadTunnelUrl();
            setInterval(loadTunnelUrl, 15000);
        </script>
    </body>
    </html>
