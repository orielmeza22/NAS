---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-qr
  namespace: default
  labels:
    app.kubernetes.io/name: portal-qr
    app.kubernetes.io/component: web-portal
    app.kubernetes.io/part-of: nas-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: portal-qr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portal-qr
        app.kubernetes.io/component: web-portal
        app.kubernetes.io/part-of: nas-platform
    spec:
      automountServiceAccountToken: false
      hostPID: true
      containers:
      - name: control-center
        image: python:3.11-alpine@sha256:c8db9fc7f3437f929b45bfeb7790c11b3b7198ba2633cf0a9b3556d3498f881e
        command: ["python3", "/app-config/server.py"]
        securityContext:
          privileged: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
            add:
              - NET_BIND_SERVICE
        ports:
        - containerPort: 80
          name: https
        volumeMounts:
        - name: app-volume
          mountPath: /app-config
          readOnly: true
        - name: agent-socket
          mountPath: /run/nas-agentd
        - name: tunnel-volume
          mountPath: /tmp/nas-tunnel
        - name: tls-volume
          mountPath: /tmp/nas-tls
          readOnly: true
        - name: tmp-volume
          mountPath: /tmp/work
        startupProbe:
          httpGet:
            path: /api/public/status
            port: 80
            scheme: HTTPS
          initialDelaySeconds: 2
          periodSeconds: 2
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /api/public/status
            port: 80
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /api/public/status
            port: 80
            scheme: HTTPS
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        resources:
          requests:
            cpu: "30m"
            memory: "48Mi"
          limits:
            cpu: "250m"
            memory: "192Mi"
      - name: nas-agentd
        image: python:3.11-alpine@sha256:c8db9fc7f3437f929b45bfeb7790c11b3b7198ba2633cf0a9b3556d3498f881e
        command: ["python3", "/app-config/nas_agentd.py"]
        securityContext:
          privileged: true
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: app-volume
          mountPath: /app-config
          readOnly: true
        - name: agent-socket
          mountPath: /run/nas-agentd
        - name: tunnel-volume
          mountPath: /tmp/nas-tunnel
        - name: agent-logs
          mountPath: /var/log
        resources:
          requests:
            cpu: "20m"
            memory: "32Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
      volumes:
      - name: app-volume
        configMap:
          name: portal-qr-config
      - name: agent-socket
        emptyDir: {}
      - name: tmp-volume
        emptyDir: {}
      - name: agent-logs
        emptyDir: {}
      - name: tunnel-volume
        hostPath:
          path: /tmp/nas-tunnel
          type: DirectoryOrCreate
      - name: tls-volume
        secret:
          secretName: portal-tls-secret
          items:
          - key: tls.crt
            path: portal.crt
          - key: tls.key
            path: portal.key
