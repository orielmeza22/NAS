# Nextcloud Helm Chart Values
# Wrapper chart passing values to the official 'nextcloud' subchart dependency
nextcloud:
  image:
    repository: nextcloud
    tag: 35.0.1-apache
  nextcloud:
    host: localhost
    defaultConfigs:
      overrides.config.php: true
    configs:
      trusted-domains.config.php: |-
        <?php
        $CONFIG = array (
          'trusted_domains' => array (
            0 => 'localhost',
            1 => '127.0.0.1',
            2 => '10.0.2.15',
            3 => 'nas.escuela.local',
            4 => '*.trycloudflare.com',
          ),
        );
    extraEnv:
      - name: OVERWRITEPROTOCOL
        value: "https"
      - name: OVERWRITECLIURL
        value: "http://localhost"
      - name: TRUSTED_PROXIES
        value: "10.42.0.0/16 10.43.0.0/16 127.0.0.1 10.0.2.15"
    existingSecret:
      enabled: true
      secretName: nextcloud-admin-credentials
      usernameKey: username
      passwordKey: password
  persistence:
    enabled: true
    existingClaim: nextcloud-pvc
  internalDatabase:
    enabled: true
  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 5
  readinessProbe:
    enabled: true
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  startupProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
