                <div>
                  <div class="section-title">17. Tareas Automáticas Programadas</div>
                  <div class="section-subtitle">Supervisión y disparo manual de los trabajos que el servidor realiza en horarios nocturnos.</div>
                </div>
                <button class="btn btn-primary btn-sm" onclick="loadCronView()">Actualizar Tareas</button>
              </div>
    
              <div class="table-box">
                <table>
                  <thead>
                    <tr>
                      <th>Nombre de la Tarea</th>
                      <th>Ubicación</th>
                      <th>Frecuencia (Horario Cron)</th>
                      <th>Estado</th>
                      <th>Acción Inmediata</th>
                    </tr>
                  </thead>
                  <tbody id="tbl-cron-body">
                    <tr><td colspan="5" style="text-align:center; padding:20px; color:var(--text-muted);">Cargando tareas programadas...</td></tr>
                  </tbody>
                </table>
              </div>
            </section>
    
          </div>
        </div>
      </div>
    
      <!-- MODAL UNIVERSAL PARA LOGS EN VIVO -->
      <div id="modal-logs" class="modal-overlay">
        <div class="modal-content">
          <div class="modal-header">
            <span id="modal-logs-title">Registros del Servicio en Tiempo Real</span>
            <button class="btn btn-sm" onclick="closeModal('modal-logs')" style="padding:2px 8px;">✕</button>
          </div>
          <div class="modal-body">
            <div id="modal-logs-body" class="terminal-window" style="min-height:360px; max-height:500px;">Cargando mensajes del programa...</div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-sm" onclick="closeModal('modal-logs')">Cerrar</button>
          </div>
        </div>
      </div>
    
      <!-- MODAL DE CONFIRMACION DE SEGURIDAD -->
      <div id="modal-confirm" class="modal-overlay">
        <div class="modal-content" style="max-width:440px;">
          <div class="modal-header">
            <span style="color:#f87171;">Confirmación Requerida</span>
            <button class="btn btn-sm" onclick="closeModal('modal-confirm')" style="padding:2px 8px;">✕</button>
          </div>
          <div class="modal-body">
            <div id="modal-confirm-msg" style="font-size:13px; line-height:1.5; color:#f1f5f9;">¿Está seguro de que desea realizar esta acción?</div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-sm" onclick="closeModal('modal-confirm')">Cancelar</button>
            <button id="modal-confirm-ok" class="btn btn-danger btn-sm">Confirmar</button>
          </div>
        </div>
      </div>
    
      <!-- MODAL BANDEJA DE TAREAS EN SEGUNDO PLANO -->
      <div id="modal-task-tray" class="modal-overlay">
        <div class="modal-content" style="max-width:850px;">
          <div class="modal-header">
            <span>Bandeja de Operaciones en Segundo Plano</span>
            <button class="btn btn-sm" onclick="closeModal('modal-task-tray')" style="padding:2px 8px;">✕</button>
          </div>
          <div class="modal-body">
            <div style="font-size:12px; color:var(--text-muted); margin-bottom:12px;">
              Operaciones pesadas administradas asíncronamente para no congelar la navegación.
            </div>
            <div class="table-box">
              <table>
                <thead>
                  <tr>
                    <th>ID Tarea</th>
                    <th>Acción Operativa</th>
                    <th>Estado</th>
                    <th>Progreso</th>
                    <th>Fase Actual</th>
                    <th>Acción</th>
                  </tr>
                </thead>
                <tbody id="tbl-tasks-body">
                  <tr><td colspan="6" style="text-align:center; color:var(--text-muted);">Sin tareas activas.</td></tr>
                </tbody>
              </table>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-sm" onclick="refreshTasksTray()">Actualizar</button>
            <button class="btn btn-sm btn-primary" onclick="closeModal('modal-task-tray')">Cerrar</button>
          </div>
        </div>
      </div>
    
      <!-- MODAL DETALLE Y LOG EN VIVO DE TAREA ASÍNCRONA -->
      <div id="modal-task-detail" class="modal-overlay">
        <div class="modal-content" style="max-width:750px;">
          <div class="modal-header">
            <span id="modal-task-title">Seguimiento de Tarea</span>
            <button class="btn btn-sm" onclick="closeModal('modal-task-detail')" style="padding:2px 8px;">✕</button>
          </div>
          <div class="modal-body">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
              <span id="modal-task-phase" style="font-size:13px; font-weight:600; color:#fff;">Iniciando...</span>
              <span id="modal-task-status-badge" class="badge badge-ok">EN CURSO</span>
            </div>
            <div style="background:#0f172a; border-radius:6px; height:12px; width:100%; overflow:hidden; border:1px solid var(--border); margin-bottom:14px;">
              <div id="modal-task-progress-bar" style="background:var(--primary); height:100%; width:0%; transition:width 0.4s ease;"></div>
            </div>
            <div class="terminal-window" id="modal-task-log" style="min-height:280px; max-height:420px; font-size:12px;">Conectando con el registro de la tarea...</div>
          </div>
          <div class="modal-footer">
            <button id="btn-cancel-task" class="btn btn-sm btn-danger" onclick="cancelCurrentTask()" style="display:none;">Cancelar Operación</button>
            <button class="btn btn-sm" onclick="closeModal('modal-task-detail')">Cerrar Visor</button>
          </div>
        </div>
      </div>
    
      <!-- MODAL IMPORTACION MASIVA CSV DE USUARIOS -->
      <div id="modal-import-csv" class="modal-overlay">
        <div class="modal-content" style="max-width:680px;">
          <div class="modal-header">
            <span>Importación Masiva de Usuarios (Planilla CSV)</span>
            <button class="btn btn-sm" onclick="closeModal('modal-import-csv')" style="padding:2px 8px;">✕</button>
          </div>
          <div class="modal-body">
            <p style="font-size:12px; color:var(--text-muted); margin-bottom:10px;">
              Pegue la nómina de usuarios escolares. Cada fila debe tener el formato: <code>usuario,contraseña,nombre_completo,grupo</code> (grupo opcional: alumnos, docentes, directivos).
            </p>
            <div style="font-size:11px; background:#1e293b; padding:8px 12px; border-radius:6px; font-family:var(--font-mono); margin-bottom:12px; color:#94a3b8;">
              Ejemplo:<br>
              lucas_gonzalez,ClaveEscolar2026!,Lucas Gonzalez,alumnos<br>
              laura_martinez,DocenteSegura2026!,Laura Martinez,docentes
            </div>
            <textarea id="txt-csv-users" style="width:100%; height:180px; background:#0b1120; border:1px solid var(--border); border-radius:6px; color:#fff; font-family:var(--font-mono); font-size:12px; padding:10px; resize:vertical;" placeholder="usuario,contraseña,nombre_completo,grupo"></textarea>
          </div>
          <div class="modal-footer">
            <button class="btn btn-sm" onclick="closeModal('modal-import-csv')">Cancelar</button>
            <button class="btn btn-sm btn-primary" onclick="submitCsvImport()">Iniciar Alta Masiva</button>
          </div>
        </div>
      </div>
    
      <!-- NOTIFICACION TOAST -->
      <div id="toast" class="toast"></div>
    
      <script>
        // =========================================================================
        // SEGURIDAD & AUTENTICACION MANDATORIA (GATEKEEPER)
        // =========================================================================
        function getAuthToken() {
          return sessionStorage.getItem('nas_auth_token') || '';
        }
    
        function checkAuthState() {
          const token = getAuthToken();
          const loginView = document.getElementById('login-view');
          const appLayout = document.getElementById('app-layout');
          if (token) {
            loginView.style.display = 'none';
            appLayout.style.display = 'flex';
            const user = sessionStorage.getItem('nas_auth_user') || 'admin';
            document.getElementById('lbl-operator-user').innerText = user;
            startPolling();
            loadServicesView();
          } else {
            loginView.style.display = 'flex';
            appLayout.style.display = 'none';
          }
        }
    
        async function handleLoginSubmit(e) {
          e.preventDefault();
          const u = document.getElementById('login-user').value.trim();
          const p = document.getElementById('login-pass').value;
          const errBox = document.getElementById('login-error');
          errBox.style.display = 'none';
    
          try {
            const res = await fetch('/api/auth/login', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({username: u, password: p})
            });
            const data = await res.json();
            if (data && data.success && data.token) {
              sessionStorage.setItem('nas_auth_token', data.token);
              sessionStorage.setItem('nas_auth_user', data.username || u);
              checkAuthState();
            } else {
              errBox.innerText = data.error || 'Credenciales incorrectas.';
              errBox.style.display = 'block';
            }
          } catch (err) {
            errBox.innerText = 'Error de conexión con el servidor: ' + err.message;
            errBox.style.display = 'block';
          }
        }
    
        function handleLogout() {
          const token = getAuthToken();
          if (token) {
            fetch('/api/auth/logout', {
              method: 'POST',
              headers: {'Authorization': 'Bearer ' + token}
            }).catch(() => {});
          }
          sessionStorage.removeItem('nas_auth_token');
          sessionStorage.removeItem('nas_auth_user');
          checkAuthState();
        }
    
        // =========================================================================
        // NAVEGACION ENTRE SECCIONES
        // =========================================================================
        function navigate(secId, btn) {
          document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
          document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
          const target = document.getElementById('sec-' + secId);
          if (target) target.classList.add('active');
          if (btn) btn.classList.add('active');
    
          // Carga perezosa segun la seccion seleccionada
          if (secId === 'services') loadServicesView();
          if (secId === 'audit') loadAuditLogs();
          if (secId === 'disks') loadDisksView();
          if (secId === 'datasets') loadDatasetsView();
          if (secId === 'files') loadFilesView('/tank/nas');
          if (secId === 'users') loadUsersView();
          if (secId === 'samba') { loadSambaShares(); loadSambaSessions(); }
          if (secId === 'network') loadNetworkView();
          if (secId === 'snapshots') loadSnapshotsView();
          if (secId === 'ups') loadUpsView();
          if (secId === 'cron') loadCronView();
        }
    
        function showToast(msg) {
          const el = document.getElementById('toast');
          el.innerText = msg;
          el.style.display = 'block';
          setTimeout(() => { el.style.display = 'none'; }, 4000);
        }
    
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    
        // =========================================================================
        // COMUNICACION CON EL BACKEND (REST API CON TOKEN BEARER)
        // =========================================================================
        async function execCmd(action, params, isSilent) {
          const token = getAuthToken();
          if (!token) {
            checkAuthState();
            return;
          }
          try {
            const res = await fetch('/api/agent/action', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
              },
              body: JSON.stringify({action: action, params: params || {}})
            });
    
            if (res.status === 401) {
              handleLogout();
              alert('Su sesión ha expirado. Por favor ingrese sus credenciales nuevamente.');
              return;
            }
    
            const data = await res.json();
            if (data && data.async && data.task_id) {
              showToast('⏳ ' + (data.message || 'Tarea iniciada en segundo plano...'));
              trackAsyncTask(data.task_id, action);
              return data;
            }
    
            if (!isSilent) {
              if (data && data.success) {
                const statusMsg = (data.data && data.data.status) || 'Acción completada con éxito.';
                showToast('✓ ' + statusMsg);
              } else {
                const errMsg = (data && (data.error || (data.data && (data.data.error || data.data.output)))) || 'Error al ejecutar acción.';
                showToast('✗ ' + errMsg);
              }
            }
            return data;
          } catch (err) {
            if (!isSilent) showToast('Error de conexión: ' + err.message);
          }
        }
    
        // =========================================================================
        // GESTOR DE TAREAS ASINCRONAS EN SEGUNDO PLANO
        // =========================================================================
        let currentViewingTaskId = null;
        let taskTrayPollInterval = null;
    
        function openTaskTray() {
          refreshTasksTray();
          openModal('modal-task-tray');
        }
    
        async function refreshTasksTray() {
          const token = getAuthToken();
          if (!token) return;
          try {
            const res = await fetch('/api/tasks', { headers: { 'Authorization': 'Bearer ' + token } });
            if (res.ok) {
              const d = await res.json();
              renderTasksTable(d.tasks || []);
            }
          } catch (e) {}
        }
    
        function renderTasksTable(tasks) {
          const tbody = document.getElementById('tbl-tasks-body');
          if (!tbody) return;
          if (!tasks || !tasks.length) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:var(--text-muted); padding:16px;">Sin operaciones registradas recientemente.</td></tr>';
            updateTaskTrayBadge(0);
            return;
          }
          tbody.innerHTML = '';
          let runningCount = 0;
          tasks.forEach(t => {
            if (t.status === 'running') runningCount++;
            const tr = document.createElement('tr');
            const badgeClass = t.status === 'completed' ? 'badge-ok' : (t.status === 'running' ? 'badge-warn' : 'badge-danger');
            tr.innerHTML = `
              <td style="font-family:var(--font-mono); font-weight:600; color:#94a3b8;">${t.task_id}</td>
              <td style="font-weight:600; color:#fff;">${t.action}</td>
              <td><span class="badge ${badgeClass}">${t.status.toUpperCase()}</span></td>
              <td>
                <div style="background:#1e293b; border-radius:4px; height:8px; width:70px; overflow:hidden; display:inline-block; vertical-align:middle; margin-right:6px;">
                  <div style="background:var(--primary); height:100%; width:${t.progress}%;"></div>
                </div>
                <span style="font-size:11px; font-family:var(--font-mono);">${t.progress}%</span>
              </td>
              <td style="font-size:12px; color:var(--text-muted);">${t.phase || '-'}</td>
              <td>
                <button class="btn btn-sm btn-primary" onclick="viewTaskDetails('${t.task_id}', '${t.action}')" style="padding:2px 8px;">Ver Log</button>
              </td>
            `;
            tbody.appendChild(tr);
          });
          updateTaskTrayBadge(runningCount);
        }
    
        function updateTaskTrayBadge(runningCount) {
          const btn = document.getElementById('btn-task-tray');
          const lbl = document.getElementById('lbl-task-tray');
          if (btn && lbl) {
            if (runningCount > 0) {
              btn.style.display = 'inline-flex';
              lbl.innerText = `${runningCount} Tarea${runningCount > 1 ? 's' : ''} en Curso`;
            } else {
              btn.style.display = 'none';
            }
          }
        }
    
        function trackAsyncTask(taskId, action) {
          updateTaskTrayBadge(1);
          viewTaskDetails(taskId, action);
          const poll = async () => {
            const token = getAuthToken();
            if (!token) return;
            try {
              const res = await fetch(`/api/tasks/${taskId}`, { headers: { 'Authorization': 'Bearer ' + token } });
              if (res.ok) {
                const data = await res.json();
                const t = data.task;
                if (t) {
                  if (currentViewingTaskId === taskId) {
                    updateTaskDetailModal(t);
                  }
                  if (t.status === 'completed') {
                    showToast(`✓ Operación '${action}' finalizada con éxito.`);
                    refreshTasksTray();
                    return;
                  } else if (t.status === 'failed' || t.status === 'cancelled') {
                    showToast(`✗ Operación '${action}' finalizó con estado: ${t.status}.`);
                    refreshTasksTray();
                    return;
                  }
                }
              }
            } catch (e) {}
            setTimeout(poll, 1500);
          };
          setTimeout(poll, 1200);
        }
    
        function viewTaskDetails(taskId, action) {
          currentViewingTaskId = taskId;
          document.getElementById('modal-task-title').innerText = `Seguimiento: ${action} (${taskId})`;
          document.getElementById('modal-task-phase').innerText = 'Cargando estado...';
          document.getElementById('modal-task-log').innerText = 'Recuperando registros...';
          document.getElementById('modal-task-progress-bar').style.width = '0%';
          document.getElementById('btn-cancel-task').style.display = 'none';
          openModal('modal-task-detail');
          fetchTaskDetail(taskId);
        }
    
        async function fetchTaskDetail(taskId) {
          const token = getAuthToken();
          if (!token) return;
          try {
            const res = await fetch(`/api/tasks/${taskId}`, { headers: { 'Authorization': 'Bearer ' + token } });
            if (res.ok) {
              const data = await res.json();
              if (data.task && currentViewingTaskId === taskId) {
                updateTaskDetailModal(data.task);
              }
            }
          } catch (e) {}
        }
    
        function updateTaskDetailModal(t) {
          document.getElementById('modal-task-phase').innerText = t.phase || 'Ejecutando...';
          document.getElementById('modal-task-progress-bar').style.width = (t.progress || 0) + '%';
          const logEl = document.getElementById('modal-task-log');
          logEl.innerText = t.log || '(Sin registros adicionales aún)';
          logEl.scrollTop = logEl.scrollHeight;
    
          const badge = document.getElementById('modal-task-status-badge');
          badge.className = 'badge ' + (t.status === 'completed' ? 'badge-ok' : (t.status === 'running' ? 'badge-warn' : 'badge-danger'));
          badge.innerText = t.status.toUpperCase();
    
          const cancelBtn = document.getElementById('btn-cancel-task');
          cancelBtn.style.display = (t.status === 'running') ? 'inline-block' : 'none';
        }
    
        async function cancelCurrentTask() {
          if (!currentViewingTaskId) return;
          const token = getAuthToken();
          if (!token) return;
          await fetch(`/api/tasks/${currentViewingTaskId}/cancel`, {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
            body: JSON.stringify({ task_id: currentViewingTaskId })
          });
          showToast('Señal de cancelación enviada.');
          fetchTaskDetail(currentViewingTaskId);
        }
    
        async function submitCsvImport() {
          const txt = document.getElementById('txt-csv-users').value.trim();
          if (!txt) {
            alert('Por favor ingrese al menos una línea de datos en formato CSV.');
            return;
          }
          closeModal('modal-import-csv');
          await execCmd('users.import_csv', { csv: txt });
          document.getElementById('txt-csv-users').value = '';
        }
    
        // Detector de caídas de red y reconexión transparente
        window.addEventListener('offline', () => {
          document.getElementById('offline-banner').style.display = 'block';
        });
        window.addEventListener('online', () => {
          document.getElementById('offline-banner').style.display = 'none';
          showToast('✓ Conexión con el servidor escolar restablecida.');
        });
    
        // =========================================================================
        // 1. ESTADO GENERAL & TELEMETRIA
        // =========================================================================
        let pollTimer = null;
        let taskPollTimer = null;
        function startPolling() {
          if (pollTimer) clearInterval(pollTimer);
          if (taskPollTimer) clearInterval(taskPollTimer);
          pollTelemetry();
          refreshTasksTray();
          pollTimer = setInterval(pollTelemetry, 3500);
          taskPollTimer = setInterval(refreshTasksTray, 4000);
        }
    
        async function pollTelemetry() {
          try {
            const res = await execCmd('system.status', {}, true);
            if (res && res.data) {
              const l = res.data.loadavg || [0, 0, 0];
              document.getElementById('dash-cpu-load').innerText = l[0].toFixed(2) + ', ' + l[1].toFixed(2) + ', ' + l[2].toFixed(2);
              if (res.data.mem) {
                const tot = parseInt(res.data.mem.MemTotal || '0');
                const avail = parseInt(res.data.mem.MemAvailable || '0');
                const used = tot - avail;
                const pct = Math.round((used / tot) * 100);
                document.getElementById('dash-ram-usage').innerText = (used/1048576).toFixed(1) + ' GB (' + pct + '%)';
                document.getElementById('dash-ram-sub').innerText = 'Total: ' + (tot/1048576).toFixed(1) + ' GB | Libre: ' + (avail/1048576).toFixed(1) + ' GB';
              }
            }
    
            const zfsRes = await execCmd('zfs.pool.status', {}, true);
            if (zfsRes && zfsRes.data && zfsRes.data.stdout) {
              document.getElementById('dash-zpool-output').innerText = zfsRes.data.stdout;
              const isOk = zfsRes.data.stdout.includes('state: ONLINE');
              document.getElementById('badge-zfs-state').innerText = isOk ? 'Almacenamiento: OK' : 'Almacenamiento: DEGRADADO';
              document.getElementById('badge-zfs-state').className = isOk ? 'badge badge-ok' : 'badge badge-warn';
              document.getElementById('dash-pool-state').innerText = isOk ? 'ONLINE' : 'DEGRADADO';
            }
          } catch (e) {}
        }
    
        // =========================================================================
        // 2. SERVICIOS Y PROGRAMAS (K8S)
        // =========================================================================
        async function loadServicesView() {
          const res = await execCmd('services.list', {}, true);
          const tbody = document.getElementById('tbl-services-body');
          if (res && res.data && res.data.services) {
            tbody.innerHTML = '';
            res.data.services.forEach(s => {
              const tr = document.createElement('tr');
              const isRunning = s.replicas > 0;
              tr.innerHTML = `
                <td style="font-weight:600; color:#fff;">${s.name}</td>
                <td style="color:var(--text-muted); font-family:var(--font-mono); font-size:11px;">${s.namespace}</td>
                <td><span class="badge ${isRunning ? 'badge-ok' : 'badge-warn'}">${s.status} (${s.ready}/${s.replicas})</span></td>
                <td>
                  <div style="display:flex; gap:6px;">
                    <button class="btn btn-sm btn-primary" onclick="showServiceLogs('${s.name}', '${s.namespace}')">Ver Logs</button>
                    <button class="btn btn-sm" onclick="execCmd('services.restart', {service: '${s.name}', namespace: '${s.namespace}'})">Reiniciar</button>
                    ${isRunning ? 
                      `<button class="btn btn-sm btn-warning" onclick="execCmd('services.scale', {service: '${s.name}', namespace: '${s.namespace}', replicas: 0})">Pausar</button>` :
                      `<button class="btn btn-sm btn-success" onclick="execCmd('services.scale', {service: '${s.name}', namespace: '${s.namespace}', replicas: 1})">Iniciar</button>`}
                  </div>
                </td>
              `;
              tbody.appendChild(tr);
            });
          }
        }
    
        async function showServiceLogs(name, ns) {
          document.getElementById('modal-logs-title').innerText = `Registros de ${name} (Espacio: ${ns})`;
          document.getElementById('modal-logs-body').innerText = 'Consultando registros del contenedor...';
          openModal('modal-logs');
          const res = await execCmd('services.logs', {service: name, namespace: ns, lines: 100}, true);
          if (res && res.data) {
            document.getElementById('modal-logs-body').innerText = res.data.logs || 'Sin registros.';
          }
        }
    
        // =========================================================================
        // 3. REGISTRO DE ACTIVIDAD
        // =========================================================================
        async function loadAuditLogs() {
          const res = await execCmd('audit.logs.list', {}, true);
          const tbody = document.getElementById('tbl-audit-body');
          if (res && res.data && res.data.entries) {
            tbody.innerHTML = '';
            if (res.data.entries.length === 0) {
              tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:20px; color:var(--text-muted);">Sin eventos registrados.</td></tr>';
              return;
            }
            res.data.entries.forEach(e => {
              const tr = document.createElement('tr');
              tr.innerHTML = `
                <td style="font-family:var(--font-mono); font-size:11px;">${e.timestamp}</td>
                <td style="font-weight:600;">${e.user}</td>
                <td style="color:#93c5fd; font-family:var(--font-mono);">${e.action}</td>
                <td><span class="badge ${e.success ? 'badge-ok' : 'badge-warn'}">${e.success ? 'OK' : 'FALLO'}</span></td>
                <td style="color:var(--text-muted); font-size:11px;">${e.message || ''}</td>
              `;
              tbody.appendChild(tr);
            });
          }
        }
    
        // =========================================================================
        // 4. DISCOS Y ALMACENAMIENTO (RAID)
        // =========================================================================
        async function loadDisksView() {
          const res = await execCmd('storage.disks.list', {}, true);
          const tbody = document.getElementById('tbl-disks');
          if (res && res.data && res.data.blockdevices) {
            tbody.innerHTML = '';
            res.data.blockdevices.forEach(d => {
              const tr = document.createElement('tr');
              const devPath = '/dev/' + d.name;
              tr.innerHTML = `
                <td style="font-weight:600; color:#fff; font-family:var(--font-mono);">${devPath}</td>
                <td>${d.size || '--'}</td>
                <td>${d.type || '--'}</td>
                <td style="color:var(--text-muted);">${(d.model || '') + ' ' + (d.serial || '')}</td>
                <td>
                  <div style="display:flex; gap:6px;">
                    <button class="btn btn-sm btn-primary" onclick="execCmd('storage.smart.test', {device: '${devPath}', type: 'short'})">Test SMART Rápido</button>
                    <button class="btn btn-sm btn-warning" onclick="execCmd('zfs.disk.offline', {device: '${devPath}'})">Poner Fuera de Línea</button>
                    <button class="btn btn-sm btn-success" onclick="execCmd('zfs.disk.online', {device: '${devPath}'})">Reactivar</button>
                  </div>
                </td>
              `;
              tbody.appendChild(tr);
            });
          }
        }
    
        // =========================================================================
        // 5. CARPETAS PRINCIPALES Y LIMITES (DATASETS & CUOTAS)
        // =========================================================================
        async function loadDatasetsView() {
          const res = await execCmd('zfs.dataset.list', {}, true);
          const tbody = document.getElementById('tbl-datasets-body');
          if (res && res.data && res.data.datasets) {
            tbody.innerHTML = '';
            res.data.datasets.forEach(ds => {
              const tr = document.createElement('tr');
              const isRoot = ds.name === 'tank' || ds.name === 'tank/nas';
              tr.innerHTML = `
                <td style="font-weight:600; color:#fff; font-family:var(--font-mono);">${ds.name}</td>
                <td>${ds.used}</td>
                <td>${ds.avail}</td>
                <td><span class="badge" style="background:#1e3a5f; color:#93c5fd;">${ds.compression}</span></td>
                <td>${ds.quota}</td>
                <td>
                  <div style="display:flex; gap:6px;">
                    <button class="btn btn-sm btn-primary" onclick="promptQuotaChange('${ds.name}')">Fijar Cuota</button>
                    ${!isRoot ? `<button class="btn btn-sm btn-danger" onclick="confirmDeleteDataset('${ds.name}')">Eliminar</button>` : ''}
                  </div>
                </td>
              `;
              tbody.appendChild(tr);
            });
          }
        }
    
        async function createDatasetSubmit() {
          const ds = document.getElementById('ds-create-name').value.trim();
          const comp = document.getElementById('ds-create-comp').value;
          const q = document.getElementById('ds-create-quota').value.trim() || 'none';
          if (!ds) return alert('Por favor ingrese el nombre del espacio (ej: tank/nas/proyectos)');
          await execCmd('zfs.dataset.create', {dataset: ds, compression: comp, quota: q});
          loadDatasetsView();
        }
    
        function promptQuotaChange(ds) {
          const q = prompt(`Ingrese el nuevo límite de espacio para ${ds} (ej: 20G, 50G o none):`, 'none');
          if (q !== null) {
            execCmd('zfs.dataset.set_quota', {dataset: ds, quota: q.trim()}).then(loadDatasetsView);
          }
        }
    
        function confirmDeleteDataset(ds) {
          const confirmStr = prompt(`ADVERTENCIA: Se eliminará la carpeta ${ds} y todos sus archivos.\nPara confirmar, escriba exactamente: ELIMINAR`);
          if (confirmStr === 'ELIMINAR') {
            execCmd('zfs.dataset.delete', {dataset: ds}).then(loadDatasetsView);
          }
        }
    
        // =========================================================================
        // 6. ADMINISTRADOR DE ARCHIVOS WEB
        // =========================================================================
        async function loadFilesView(path) {
          document.getElementById('files-current-path').innerText = path;
          const res = await execCmd('files.list_all', {path: path}, true);
          const tbody = document.getElementById('tbl-files-body');
          if (res && res.data && res.data.items) {
            tbody.innerHTML = '';
            if (res.data.items.length === 0) {
              tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:20px; color:var(--text-muted);">Carpeta vacía.</td></tr>';
              return;
            }
            res.data.items.forEach(item => {
              const tr = document.createElement('tr');
              const fullPath = path.replace(/\/$/, '') + '/' + item.name;
              const sz = item.is_dir ? '--' : (item.size > 1048576 ? (item.size/1048576).toFixed(1) + ' MB' : Math.round(item.size/1024) + ' KB');
              tr.innerHTML = `
                <td style="font-weight:600; color:#fff;">
                  ${item.is_dir ? 
                    `<a href="javascript:void(0)" onclick="loadFilesView('${fullPath}')" style="color:#60a5fa; text-decoration:none;">📁 ${item.name}</a>` :
                    `📄 ${item.name}`}
                </td>
                <td>${item.is_dir ? 'Carpeta' : 'Archivo'}</td>
                <td>${sz}</td>
                <td>
                  <button class="btn btn-sm btn-danger" onclick="confirmDeleteFile('${fullPath}')">Borrar</button>
                </td>
              `;
              tbody.appendChild(tr);
            });
          }
        }
    
        function confirmDeleteFile(p) {
          if (confirm(`¿Desea eliminar permanentemente: ${p}?`)) {
            execCmd('files.delete', {path: p}).then(() => {
              const parent = p.substring(0, p.lastIndexOf('/')) || '/tank/nas';
              loadFilesView(parent);
            });
          }
        }
    
        // =========================================================================
        // 7. USUARIOS Y CONTRASENAS (IDENTIDAD DUAL)
        // =========================================================================
        async function loadUsersView() {
          const res = await execCmd('users.list', {}, true);
          const tbody = document.getElementById('tbl-users-body');
          if (res && res.data && res.data.users) {
            tbody.innerHTML = '';
            res.data.users.forEach(u => {
              const tr = document.createElement('tr');
              const isAdm = u.username === 'admin';
              tr.innerHTML = `
                <td style="font-weight:600; color:#fff; font-family:var(--font-mono);">${u.username}</td>
                <td>${u.display_name}</td>
                <td><span class="badge" style="background:#1e3a5f; color:#93c5fd;">${u.groups.join(', ') || 'alumnos'}</span></td>
                <td><span class="badge ${u.enabled ? 'badge-ok' : 'badge-warn'}">${u.enabled ? 'Activo' : 'Suspendido'}</span></td>
                <td>
                  <div style="display:flex; gap:6px;">
                    <button class="btn btn-sm btn-primary" onclick="promptResetPassword('${u.username}')">Cambiar Clave</button>
                    ${!isAdm ? `
                      <button class="btn btn-sm ${u.enabled ? 'btn-warning' : 'btn-success'}" onclick="execCmd('users.toggle_status', {username: '${u.username}', enable: ${!u.enabled}}).then(loadUsersView)">${u.enabled ? 'Suspender' : 'Habilitar'}</button>
                      <button class="btn btn-sm btn-danger" onclick="confirmDeleteUser('${u.username}')">Eliminar</button>
                    ` : ''}
                  </div>
                </td>
              `;
              tbody.appendChild(tr);
            });
          }
        }
    
        async function createUserSubmit() {
          const u = document.getElementById('usr-name').value.trim();
          const d = document.getElementById('usr-disp').value.trim() || u;
          const p = document.getElementById('usr-pass').value;
          const g = document.getElementById('usr-group').value;
          if (!u || !p) return alert('Por favor complete el nombre de usuario y la contraseña inicial.');
          showToast('Sincronizando cuenta en Nextcloud y carpetas de red...');
          await execCmd('users.sync_nextcloud', {username: u, display_name: d, password: p, group: g});
          document.getElementById('usr-name').value = '';
          document.getElementById('usr-disp').value = '';
          document.getElementById('usr-pass').value = '';
          loadUsersView();
        }
    
        async function resetUserSubmit() {
          const u = document.getElementById('rst-name').value.trim();
          const p = document.getElementById('rst-pass').value;
          if (!u || !p) return alert('Por favor ingrese el usuario y la nueva contraseña.');
          await execCmd('users.reset_password', {username: u, password: p});
          document.getElementById('rst-pass').value = '';
        }
    
        function promptResetPassword(u) {
          const newP = prompt(`Ingrese la nueva contraseña para el usuario ${u}:`);
          if (newP) {
            execCmd('users.reset_password', {username: u, password: newP}).then(loadUsersView);
          }
        }
    
        function confirmDeleteUser(u) {
          if (confirm(`¿Está seguro de que desea eliminar permanentemente al usuario ${u} de Nextcloud y Samba?`)) {
            execCmd('users.delete', {username: u}).then(loadUsersView);
          }
        }
    
        // =========================================================================
        // 8. CARPETAS COMPARTIDAS EN RED (SAMBA)
        // =========================================================================
        async function loadSambaShares() {
          const res = await execCmd('samba.shares.list', {}, true);
          const tbody = document.getElementById('tbl-samba-body');
          if (res && res.data && res.data.shares) {
            tbody.innerHTML = '';
            res.data.shares.forEach(s => {
              const tr = document.createElement('tr');
              tr.innerHTML = `
                <td style="font-weight:600; color:#fff; font-family:var(--font-mono);">\\\\nas.escuela.local\\${s.name}</td>
                <td style="color:var(--text-muted); font-size:11px;">${s.path}</td>
                <td><span class="badge ${s.readonly ? 'badge-warn' : 'badge-ok'}">${s.readonly ? 'Solo Lectura' : 'Lectura y Escritura'}</span></td>
                <td><span class="badge ${s.recycle ? 'badge-ok' : 'badge-warn'}">${s.recycle ? 'Activada (.Papelera)' : 'Desactivada'}</span></td>
                <td style="color:var(--text-muted);">${s.desc}</td>
              `;
              tbody.appendChild(tr);
            });
          }
        }
    
        async function loadSambaSessions() {
          const res = await execCmd('samba.sessions', {}, true);
          if (res && res.data) {
            document.getElementById('samba-sessions-output').innerText = res.data.sessions_raw || 'Sin sesiones activas.';
          }
        }
    
        // =========================================================================
        // 9. CONFIGURACION DE RED
        // =========================================================================
        async function loadNetworkView() {
          const res = await execCmd('network.status', {}, true);
          if (res && res.data) {
            document.getElementById('net-interfaces-output').innerText = res.data.interfaces || 'Sin datos de red.';
          }
        }
    
        function applyNetworkWithTimer() {
          const ip = document.getElementById('net-ip').value.trim();
          const gw = document.getElementById('net-gw').value.trim();
          if (!ip) return alert('Ingrese la dirección IP con máscara (ej: 192.168.1.50/24)');
          if (confirm(`Se aplicará la IP ${ip}. Tiene 60 segundos para confirmar conectividad o el servidor volverá a su IP anterior automáticamente. ¿Continuar?`)) {
            execCmd('network.apply', {ip: ip, gateway: gw});
          }
        }
    
        // =========================================================================
        // 10. PUNTOS DE RESTAURACION (SNAPSHOTS)
        // =========================================================================
        async function loadSnapshotsView() {
          const res = await execCmd('snapshots.list', {}, true);
          const tbody = document.getElementById('tbl-snapshots-body');
          if (res && res.data && res.data.snapshots) {
            tbody.innerHTML = '';
            if (res.data.snapshots.length === 0) {
              tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:20px; color:var(--text-muted);">Sin puntos de restauración registrados.</td></tr>';
              return;
            }
            res.data.snapshots.forEach(s => {
              const tr = document.createElement('tr');
              tr.innerHTML = `
                <td style="font-weight:600; color:#fff; font-family:var(--font-mono);">${s.name}</td>
                <td>${s.used}</td>
                <td style="color:var(--text-muted); font-size:11px;">${s.creation}</td>
                <td>
                  <div style="display:flex; gap:6px;">
                    <button class="btn btn-sm btn-warning" onclick="confirmRollback('${s.name}')">Restaurar al Estado</button>
                    <button class="btn btn-sm btn-danger" onclick="confirmDestroySnapshot('${s.name}')">Borrar</button>
                  </div>
                </td>
              `;
              tbody.appendChild(tr);
            });
          }
        }
    
        async function createSnapshotSubmit() {
          const tag = document.getElementById('snap-create-tag').value.trim();
          await execCmd('snapshots.create', {tag: tag});
          document.getElementById('snap-create-tag').value = '';
          loadSnapshotsView();
        }
    
        function confirmRollback(name) {
          if (confirm(`ADVERTENCIA: Restaurar al snapshot ${name} revertirá todos los archivos y bases de datos a esa fecha exacta. ¿Desea proceder?`)) {
            execCmd('snapshots.rollback', {name: name});
          }
        }
    
        function confirmDestroySnapshot(name) {
          if (confirm(`¿Desea eliminar el snapshot ${name}?`)) {
            execCmd('snapshots.destroy', {name: name}).then(loadSnapshotsView);
          }
        }
    
        // =========================================================================
        // 12. SIMULACRO DE RECUPERACION (DR)
        // =========================================================================
        async function runDrillSubmit() {
          const box = document.getElementById('dr-output-box');
          box.innerText = 'Ejecutando simulacro de recuperación en 5 fases... Espere por favor.';
          const res = await execCmd('dr.run_drill', {});
          if (res && res.data) {
            box.innerText = `TIEMPO DE RECUPERACION (RTO): ${res.data.rto_seconds} SEGUNDOS\nRESULTADO: ${res.data.passed ? 'EXITOSO (100% OPERATIVO)' : 'FALLO'}\n\n${res.data.log}`;
          }
        }
    
        // =========================================================================
        // 13. BATERIA DE EMERGENCIA (UPS)
        // =========================================================================
        async function loadUpsView() {
          const res = await execCmd('ups.status', {}, true);
          if (res && res.data) {
            document.getElementById('ups-status-val').innerText = res.data['ups.status'] || 'En Línea';
            document.getElementById('ups-charge-val').innerText = res.data['battery.charge'] || '100%';
            document.getElementById('ups-runtime-val').innerText = res.data['battery.runtime'] || '45 Minutos';
          }
        }
    
        // =========================================================================
        // 14. TERMINAL DE DIAGNOSTICO
        // =========================================================================
        async function runShellCmd(cmd) {
          document.getElementById('terminal-output').innerText = `Ejecutando: ${cmd}...\n`;
          const res = await execCmd('shell.exec', {command: cmd}, true);
          if (res && res.data) {
            document.getElementById('terminal-output').innerText = res.data.output || 'Sin salida.';
          }
        }
    
        function runCustomShellCmd() {
          const cmd = document.getElementById('terminal-input').value.trim();
          if (cmd) runShellCmd(cmd);
        }
    
        // =========================================================================
        // 15. CERTIFICADOS DE SEGURIDAD (SSL / PKI)
        // =========================================================================
        async function downloadCaCertSubmit() {
          const res = await execCmd('pki.download_ca', {}, true);
          if (res && res.data && res.data.cert) {
            const blob = new Blob([res.data.cert], {type: 'application/x-x509-ca-cert'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = res.data.filename || 'Enterprise-NAS-CA.crt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('✓ Certificado de seguridad descargado.');
          } else {
            alert('No se pudo descargar el certificado.');
          }
        }
    
        // =========================================================================
        // 17. TAREAS AUTOMATICAS (CRONJOBS)
        // =========================================================================
        async function loadCronView() {
          const res = await execCmd('cron.list', {}, true);
          const tbody = document.getElementById('tbl-cron-body');
          if (res && res.data && res.data.cronjobs) {
            tbody.innerHTML = '';
            res.data.cronjobs.forEach(c => {
              const tr = document.createElement('tr');
              tr.innerHTML = `
                <td style="font-weight:600; color:#fff;">${c.name}</td>
                <td style="color:var(--text-muted); font-size:11px;">${c.namespace}</td>
                <td style="font-family:var(--font-mono); color:#93c5fd;">${c.schedule}</td>
                <td><span class="badge ${!c.suspend ? 'badge-ok' : 'badge-warn'}">${!c.suspend ? 'Activo' : 'Pausado'}</span></td>
                <td>
                  <button class="btn btn-sm btn-primary" onclick="execCmd('cron.trigger_now', {name: '${c.name}', namespace: '${c.namespace}'})">Ejecutar Ahora</button>
                </td>
              `;
              tbody.appendChild(tr);
            });
          }
        }
    
        // =========================================================================
        // ACCIONES DE ENERGIA (REBOOT / POWEROFF)
        // =========================================================================
        function confirmPower(cmd, msg) {
          document.getElementById('modal-confirm-msg').innerText = msg;
          const okBtn = document.getElementById('modal-confirm-ok');
          okBtn.onclick = () => {
            closeModal('modal-confirm');
            execCmd('system.power', {command: cmd});
          };
          openModal('modal-confirm');
        }
    
        // =========================================================================
        // INICIALIZACION
        // =========================================================================
        window.addEventListener('DOMContentLoaded', () => {
          checkAuthState();
        });
      </script>
    </body>
    </html>
