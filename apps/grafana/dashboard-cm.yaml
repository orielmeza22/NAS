---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-nas-dashboard
  namespace: default
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: nas-platform
data:
  nas-overview.json: |
    {
      "annotations": { "list": [] },
      "editable": false,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 1,
          "title": "NAS Platform - Estado y Rendimiento del Sistema",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "fillOpacity": 80, "lineWidth": 1 },
              "unit": "percentunit"
            }
          },
          "gridPos": { "h": 7, "w": 8, "x": 0, "y": 1 },
          "id": 2,
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "values": false } },
          "title": "CPU Usage (Nodo K3s)",
          "type": "gauge",
          "targets": [
            {
              "expr": "1 - avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m]))",
              "legendFormat": "CPU Utilizada"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "fillOpacity": 80, "lineWidth": 1 },
              "unit": "bytes"
            }
          },
          "gridPos": { "h": 7, "w": 8, "x": 8, "y": 1 },
          "id": 3,
          "title": "Uso de Memoria RAM",
          "type": "gauge",
          "targets": [
            {
              "expr": "node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes",
              "legendFormat": "Memoria en Uso"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            }
          },
          "gridPos": { "h": 7, "w": 8, "x": 16, "y": 1 },
          "id": 4,
          "title": "Pods en Estado Running (Salud)",
          "type": "stat",
          "targets": [
            {
              "expr": "count(kube_pod_status_phase{phase=\"Running\"})",
              "legendFormat": "Pods Activos"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "axisCenteredZero": false, "drawStyle": "line", "lineInterpolation": "smooth" },
              "unit": "Bps"
            }
          },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 8 },
          "id": 5,
          "title": "Tasa de I/O en Almacenamiento (ZFS Pool I/O Bandwidth)",
          "type": "timeseries",
          "targets": [
            {
              "expr": "rate(node_disk_read_bytes_total[2m])",
              "legendFormat": "Lectura {{device}}"
            },
            {
              "expr": "rate(node_disk_written_bytes_total[2m])",
              "legendFormat": "Escritura {{device}}"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "options": {
                    "0": { "color": "red", "index": 1, "text": "DEGRADED / FAULTED" },
                    "1": { "color": "green", "index": 0, "text": "ONLINE (RAID-Z1 OK)" }
                  },
                  "type": "value"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            }
          },
          "gridPos": { "h": 6, "w": 8, "x": 0, "y": 16 },
          "id": 6,
          "title": "Estado de Salud Pool OpenZFS (tank)",
          "type": "stat",
          "targets": [
            {
              "expr": "zfs_pool_health{pool=\"tank\"}",
              "legendFormat": "Pool {{pool}}"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            }
          },
          "gridPos": { "h": 6, "w": 8, "x": 8, "y": 16 },
          "id": 7,
          "title": "Errores de Checksum ZFS (Bit-Rot Detectado)",
          "type": "stat",
          "targets": [
            {
              "expr": "zfs_pool_checksum_errors_total{pool=\"tank\"}",
              "legendFormat": "Errores CKSUM"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            }
          },
          "gridPos": { "h": 6, "w": 8, "x": 16, "y": 16 },
          "id": 8,
          "title": "Uso por Dataset y Cuotas Departamentales",
          "type": "bargauge",
          "targets": [
            {
              "expr": "zfs_dataset_used_bytes",
              "legendFormat": "{{dataset}}"
            }
          ]
        }
      ],
      "refresh": "10s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["nas", "k3s", "storage", "zfs"],
      "time": { "from": "now-30m", "to": "now" },
      "timepicker": { "refresh_intervals": ["5s", "10s", "30s", "1m"] },
      "timezone": "browser",
      "title": "Enterprise NAS Overview",
      "uid": "nas-platform-overview",
      "version": 2
    }
