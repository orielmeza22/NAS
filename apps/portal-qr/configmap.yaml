    <body>
      <header>
        <div class="brand">
          <span>💾</span> Enterprise NAS Control Center OS
          <span id="raid-badge" class="status-badge">Cargando...</span>
        </div>
        <div style="display:flex; gap:10px;">
          <button class="btn btn-outline" id="btn-killswitch" onclick="toggleLanOnly()">🌐 Modo Solo LAN</button>
