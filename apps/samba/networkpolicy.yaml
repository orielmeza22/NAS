apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: samba-network-policy
  namespace: default
  labels:
    app.kubernetes.io/name: samba
    app.kubernetes.io/part-of: nas-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: samba
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow SMB and NetBIOS traffic from authorized private networks and local clients (RFC1918 + loopback)
    - from:
        - ipBlock:
            cidr: 10.0.0.0/8
        - ipBlock:
            cidr: 172.16.0.0/12
        - ipBlock:
            cidr: 192.168.0.0/16
        - ipBlock:
            cidr: 127.0.0.0/8
      ports:
        - protocol: TCP
          port: 445
        - protocol: UDP
          port: 137
        - protocol: UDP
          port: 138
        - protocol: TCP
          port: 139
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
