        header { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
        .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.2rem; }
        .status-badge { padding: 4px 10px; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; background: #064e3b; color: var(--success); }
        .btn { background: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: 0.2s; display: inline-flex; align-items: center; gap: 6px; }
        .btn:hover { background: var(--accent-hover); }
        .btn-danger { background: var(--danger); }
        .btn-danger:hover { background: #dc2626; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-outline:hover { background: var(--border); }
        main { padding: 24px; max-width: 1300px; margin: 0 auto; width: 100%; flex: 1; }
        .public-box { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 32px; text-align: center; max-width: 480px; margin: 20px auto; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        .qr-img { width: 220px; height: 220px; border-radius: 12px; margin: 16px auto; display: block; background: white; padding: 10px; }
        .tabs { display: flex; gap: 8px; border-bottom: 1px solid var(--border); margin-bottom: 24px; overflow-x: auto; padding-bottom: 4px; }
        .tab-btn { background: none; border: none; color: var(--text-muted); padding: 10px 16px; font-size: 0.9rem; font-weight: 600; cursor: pointer; border-radius: 6px; }
        .tab-btn.active { color: var(--accent); background: #1e3a8a33; border-bottom: 2px solid var(--accent); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
        .card h3 { font-size: 1rem; color: var(--text-muted); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .card .val { font-size: 1.8rem; font-weight: 700; color: var(--text); }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 0.85rem; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
        th { color: var(--text-muted); font-weight: 600; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; place-items: center; z-index: 1000; }
        .modal.open { display: grid; }
        .modal-content { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; width: 90%; max-width: 500px; padding: 24px; }
        input, select, textarea { width: 100%; background: #0f172a; border: 1px solid var(--border); border-radius: 6px; padding: 10px; color: var(--text); margin: 8px 0 16px; font-size: 0.9rem; }
        .terminal-box { background: #000; color: #10b981; font-family: monospace; font-size: 0.8rem; padding: 16px; border-radius: 8px; max-height: 400px; overflow-y: auto; white-space: pre-wrap; }
