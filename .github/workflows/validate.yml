---
name: Validate Manifests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .
          config_data: |
            extends: default
            rules:
              line-length: disable
              truthy:
                check-keys: false
              document-start: disable
              indentation:
                spaces: 2
                indent-sequences: whatever
              comments:
                min-spaces-from-content: 1

  k8s-validate:
    name: Validate K8s Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Run kubeconform
        run: |
          kubeconform -summary -strict -ignore-missing-schemas \
            -ignore-filename-pattern '(Chart|values)\.yaml' \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{ .Group }}/{{ .ResourceKind }}_{{ .ResourceAPIVersion }}.json' \
            apps/ infrastructure/

  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  python-tests:
    name: Python Security & Module Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ensure no bytecode (.pyc) files are tracked
        run: |
          if git ls-files | grep -E '\.pyc$|__pycache__'; then
            echo "Error: Tracked .pyc or __pycache__ files detected in repository."
            exit 1
          fi
      - name: Run unit and security fuzzing test suite
        run: |
          python3 -B -m unittest discover -s tests -p "test_*.py" -v
