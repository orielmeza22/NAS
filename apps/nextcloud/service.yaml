apiVersion: v1
kind: Service
metadata:
  name: nextcloud-nodeport
  namespace: default
  labels:
    app.kubernetes.io/name: nextcloud
    app.kubernetes.io/part-of: nas-platform
spec:
  type: NodePort
  selector:
    app.kubernetes.io/component: app
    app.kubernetes.io/instance: nextcloud
    app.kubernetes.io/name: nextcloud
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30082
