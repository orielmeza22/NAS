apiVersion: batch/v1
kind: CronJob
metadata:
  name: zfs-offsite-backup
  namespace: kube-system
  labels:
    app.kubernetes.io/name: zfs-offsite-backup
    app.kubernetes.io/component: disaster-recovery
    app.kubernetes.io/part-of: nas-platform
spec:
  schedule: "0 3 * * *"
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: zfs-offsite-backup
        spec:
          hostPID: true
          containers:
          - name: r2-backup
            image: rclone/rclone@sha256:2687085f718d3c628f7fdfb77c52a1d344332aed543110bb88088f2c70d43eb5
            command: ["/bin/sh", "-c"]
            args:
            - |
              set -euo pipefail
              echo "============================================================"
              echo "[$(date -Iseconds)] INICIANDO BACKUP OFFSITE 3-2-1 (CLOUDFLARE R2)"
              echo "============================================================"

              # Verificar existencia de credenciales R2 y clave de cifrado
              if [ -z "${R2_ACCOUNT_ID:-}" ] || [ -z "${R2_ACCESS_KEY_ID:-}" ] || [ -z "${BACKUP_ENCRYPTION_KEY:-}" ]; then
                echo "[ERROR] Credenciales R2 o BACKUP_ENCRYPTION_KEY ausentes en el SealedSecret."
                exit 1
              fi

              # Configuración dinámica de rclone para Cloudflare R2 (API S3)
              export RCLONE_CONFIG_R2_TYPE="s3"
              export RCLONE_CONFIG_R2_PROVIDER="Cloudflare"
              export RCLONE_CONFIG_R2_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
              export RCLONE_CONFIG_R2_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
              export RCLONE_CONFIG_R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
              export RCLONE_CONFIG_R2_ACL="private"
              export RCLONE_CONFIG_R2_NO_CHECK_BUCKET="true"

              BUCKET="${R2_BUCKET_NAME:-nas-backup}"
              DATE_TAG=$(date +%Y%m%d-%H%M%S)
              DAY_OF_WEEK=$(date +%u)
              CURR_SNAP="tank/nas@offsite-sync-${DATE_TAG}"

              echo "[INFO] Localizando snapshot base previo para diferencial incremental..."
              PREV_SNAP=$(nsenter --target 1 --mount --uts --ipc --net --pid -- \
                zfs list -t snapshot -o name -s creation -H | grep '^tank/nas@offsite-sync-' | tail -n 1 || true)

              echo "[INFO] Creando punto de corte inmutable: ${CURR_SNAP}..."
              nsenter --target 1 --mount --uts --ipc --net --pid -- zfs snapshot -r "$CURR_SNAP"

              if [ "$DAY_OF_WEEK" = "7" ] || [ -z "$PREV_SNAP" ]; then
                REMOTE_OBJECT="r2:${BUCKET}/weekly/tank-full-${DATE_TAG}.zfs.enc"
                echo "[INFO] Ejecutando FULL BACKUP SEMANAL: ${CURR_SNAP} -> ${REMOTE_OBJECT}"
                export BACKUP_ENCRYPTION_KEY
                nsenter --target 1 --mount --uts --ipc --net --pid -- env BACKUP_ENCRYPTION_KEY="$BACKUP_ENCRYPTION_KEY" sh -c \
                  'zfs send -c -R "$1" | openssl enc -aes-256-cbc -salt -pbkdf2 -pass env:BACKUP_ENCRYPTION_KEY' \
                  -- "$CURR_SNAP" | \
                  rclone rcat "$REMOTE_OBJECT"
              else
                REMOTE_OBJECT="r2:${BUCKET}/incremental/tank-inc-${DATE_TAG}.zfs.enc"
                echo "[INFO] Ejecutando BACKUP INCREMENTAL DIARIO: ${PREV_SNAP} -> ${CURR_SNAP} (${REMOTE_OBJECT})"
                export BACKUP_ENCRYPTION_KEY
                nsenter --target 1 --mount --uts --ipc --net --pid -- env BACKUP_ENCRYPTION_KEY="$BACKUP_ENCRYPTION_KEY" sh -c \
                  'zfs send -c -R -i "$1" "$2" | openssl enc -aes-256-cbc -salt -pbkdf2 -pass env:BACKUP_ENCRYPTION_KEY' \
                  -- "$PREV_SNAP" "$CURR_SNAP" | \
                  rclone rcat "$REMOTE_OBJECT"
              fi

              # Registrar timestamp de último backup exitoso para el exportador Prometheus
              nsenter --target 1 --mount --uts --ipc --net --pid -- sh -c \
                'mkdir -p /tmp/nas-tunnel && date +%s > /tmp/nas-tunnel/last_offsite_backup_ts'

              echo "[INFO] Aplicando política de retención GFS (7 días incrementales, 30 días semanales)..."
              rclone delete --min-age 7d "r2:$BUCKET/incremental/" 2>/dev/null || true
              rclone delete --min-age 30d "r2:$BUCKET/weekly/" 2>/dev/null || true
              rclone delete --min-age 7d "r2:$BUCKET/daily/" 2>/dev/null || true

              echo "============================================================"
              echo "[$(date -Iseconds)] BACKUP OFFSITE COMPLETADO Y ROTADO EXITOSAMENTE"
              echo "============================================================"
            securityContext:
              privileged: true
            env:
            - name: R2_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: r2-backup-credentials
                  key: account-id
                  optional: true
            - name: R2_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: r2-backup-credentials
                  key: access-key-id
                  optional: true
            - name: R2_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: r2-backup-credentials
                  key: secret-access-key
                  optional: true
            - name: R2_BUCKET_NAME
              value: "nas-backup"
            - name: BACKUP_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: r2-backup-credentials
                  key: encryption-key
                  optional: true
            volumeMounts:
            - name: dev
              mountPath: /dev
            - name: zfs-config
              mountPath: /etc/zfs
            resources:
              requests:
                cpu: "100m"
                memory: "128Mi"
              limits:
                cpu: "1000m"
                memory: "512Mi"
          restartPolicy: OnFailure
          volumes:
          - name: dev
            hostPath:
              path: /dev
          - name: zfs-config
            hostPath:
              path: /etc/zfs
