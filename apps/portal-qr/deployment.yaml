apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-qr
  namespace: default
  labels:
    app.kubernetes.io/name: portal-qr
    app.kubernetes.io/component: web-portal
    app.kubernetes.io/part-of: nas-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: portal-qr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portal-qr
        app.kubernetes.io/component: web-portal
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
          name: http
        volumeMounts:
        - name: html-volume
          mountPath: /usr/share/nginx/html/index.html
          subPath: index.html
          readOnly: true
        - name: tunnel-volume
          mountPath: /usr/share/nginx/html/tunnel
          readOnly: true
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: "50m"
            memory: "32Mi"
          limits:
            cpu: "100m"
            memory: "64Mi"
      volumes:
      - name: html-volume
        configMap:
          name: portal-qr-config
      - name: tunnel-volume
        hostPath:
          path: /tmp/nas-tunnel
          type: DirectoryOrCreate
