apiVersion: v1
kind: Service
metadata:
  name: samba
  labels:
    app: samba
spec:
  type: NodePort
  selector:
    app: samba
  ports:
    - name: smb
      port: 445
      targetPort: 445
      nodePort: 30445
      protocol: TCP
    - name: netbios
      port: 137
      targetPort: 137
      nodePort: 30137
      protocol: UDP
    - name: dgram
      port: 138
      targetPort: 138
      nodePort: 30138
      protocol: UDP
    - name: session
      port: 139
      targetPort: 139
      nodePort: 30139
      protocol: TCP
