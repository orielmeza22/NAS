apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portal-qr
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: nas-platform
spec:
  project: default
  source:
    repoURL: https://github.com/orielmeza22/NAS.git
    targetRevision: HEAD
    path: apps/portal-qr
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
