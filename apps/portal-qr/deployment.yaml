---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-qr
  namespace: default
  labels:
    app.kubernetes.io/name: portal-qr
    app.kubernetes.io/component: web-portal
    app.kubernetes.io/part-of: nas-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: portal-qr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portal-qr
        app.kubernetes.io/component: web-portal
        app.kubernetes.io/part-of: nas-platform
    spec:
      automountServiceAccountToken: false
      hostPID: true
      containers:
      - name: control-center
        image: python:3.11-alpine@sha256:09d17d5e4c16d0a7a1eea690bcb7c6ab8616b211f8421e429e97c1bef5bd0ed2
        command: ["python3", "/app-config/server.py"]
        env:
        - name: PORTAL_STATE_DIR
          value: "/var/lib/nas-portal-state"
        - name: PORTAL_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: portal-admin-credentials
              key: admin-password
        - name: PORTAL_OPERATOR_PASSWORD
          valueFrom:
            secretKeyRef:
              name: portal-admin-credentials
              key: operator-password
        - name: PORTAL_TOTP_SECRET
          valueFrom:
            secretKeyRef:
              name: portal-admin-credentials
              key: totp-secret
              optional: true
        securityContext:
          privileged: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
            add:
              - NET_BIND_SERVICE
        ports:
        - containerPort: 80
          name: https
        volumeMounts:
        - name: app-volume
          mountPath: /app-config
          readOnly: true
        - name: agent-socket
          mountPath: /run/nas-agentd
        - name: portal-state
          mountPath: /var/lib/nas-portal-state
        - name: tunnel-volume
          mountPath: /tmp/nas-tunnel
        - name: tls-volume
          mountPath: /etc/nas-tls
          readOnly: true
        - name: tmp-volume
          mountPath: /tmp/work
        startupProbe:
          httpGet:
            path: /api/public/status
            port: 80
            scheme: HTTPS
          initialDelaySeconds: 2
          periodSeconds: 2
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /api/public/status
            port: 80
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /api/public/status
            port: 80
            scheme: HTTPS
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        resources:
          requests:
            cpu: "30m"
            memory: "48Mi"
          limits:
            cpu: "250m"
            memory: "192Mi"
      - name: nas-agentd
        image: python:3.11-alpine@sha256:09d17d5e4c16d0a7a1eea690bcb7c6ab8616b211f8421e429e97c1bef5bd0ed2
        command: ["python3", "/app-config/nas_agentd.py"]
        env:
        - name: PORTAL_STATE_DIR
          value: "/var/lib/nas-portal-state"
        securityContext:
          privileged: true
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: app-volume
          mountPath: /app-config
          readOnly: true
        - name: agent-socket
          mountPath: /run/nas-agentd
        - name: portal-state
          mountPath: /var/lib/nas-portal-state
        - name: tunnel-volume
          mountPath: /tmp/nas-tunnel
        - name: agent-logs
          mountPath: /var/log
        resources:
          requests:
            cpu: "20m"
            memory: "32Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
      volumes:
      - name: app-volume
        configMap:
          name: portal-qr-config
      - name: agent-socket
        emptyDir: {}
      - name: tmp-volume
        emptyDir: {}
      - name: agent-logs
        emptyDir: {}
      - name: portal-state
        hostPath:
          path: /var/lib/nas-portal-state
          type: DirectoryOrCreate
      - name: tunnel-volume
        hostPath:
          path: /tmp/nas-tunnel
          type: DirectoryOrCreate
      - name: tls-volume
        secret:
          secretName: portal-tls-secret
          optional: true
          items:
          - key: tls.crt
            path: portal.crt
          - key: tls.key
            path: portal.key
