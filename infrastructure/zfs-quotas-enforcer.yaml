---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: zfs-quotas-enforcer
  namespace: kube-system
  labels:
    app.kubernetes.io/name: zfs-quotas-enforcer
    app.kubernetes.io/component: storage-governance
    app.kubernetes.io/part-of: nas-platform
spec:
  schedule: "0 */6 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: zfs-quotas-enforcer
        spec:
          hostPID: true
          containers:
            - name: zfs-governance
              image: ubuntu@sha256:66460d557b25769b102175144d538d88219c077c678a49af4afca6fbfc1b5252
              command:
                - nsenter
                - --target
                - "1"
                - --mount
                - --uts
                - --ipc
                - --net
                - --pid
                - --
                - sh
                - -c
                - |
                  set -u
                  echo "[INFO] Aplicando gobernanza empresarial de datasets y cuotas OpenZFS..."

                  cuenta_archivos() {
                    find "$1" -type f 2>/dev/null | wc -l
                  }

                  migrate_dir_to_dataset() {
                    ds="$1"; quota_val="$2"; rec_size="${3:-128K}"
                    mnt="/$ds"

                    # Ante una migración anterior incompleta no se toca nada.
                    if [ -d "${mnt}.mig" ] || [ -d "${mnt}.orig" ]; then
                      echo "[CRITICO] Existen restos de una migración anterior (${mnt}.mig o ${mnt}.orig)."
                      echo "[CRITICO] Revise y ordene esos directorios a mano antes de reintentar. No se modificó nada."
                      return 1
                    fi

                    if [ ! -d "$mnt" ]; then
                      echo "[INFO] $mnt no existe; se crea el dataset vacío $ds."
                      zfs create -o compression=lz4 -o atime=off -o acltype=posixacl -o xattr=sa \
                        -o "recordsize=${rec_size}" -o "quota=${quota_val}" "$ds"
                      return $?
                    fi

                    echo "[INFO] Migrando $mnt al dataset $ds (se conserva una copia en todo momento)..."
                    if ! cp -a "$mnt" "${mnt}.mig"; then
                      echo "[ERROR] Falló la copia de trabajo ${mnt}.mig. El directorio original no se tocó."
                      return 1
                    fi

                    original=$(cuenta_archivos "$mnt")
                    copia=$(cuenta_archivos "${mnt}.mig")
                    if [ "$original" != "$copia" ]; then
                      echo "[ERROR] La copia tiene $copia archivos y el original $original. No se tocó el original."
                      return 1
                    fi

                    if ! zfs create -o compression=lz4 -o atime=off -o acltype=posixacl -o xattr=sa \
                         -o "recordsize=${rec_size}" -o "quota=${quota_val}" "$ds"; then
                      echo "[ERROR] No se pudo crear el dataset $ds. El original sigue en $mnt."
                      return 1
                    fi

                    # El directorio original se aparta (renombre instantáneo, mismo sistema de archivos)
                    mv "$mnt" "${mnt}.orig"

                    if ! cp -a "${mnt}.mig/." "$mnt/"; then
                      echo "[ERROR] Falló la copia al dataset. Se restaura el directorio original."
                      zfs destroy -r "$ds" 2>/dev/null || true
                      mv "${mnt}.orig" "$mnt"
                      return 1
                    fi

                    en_dataset=$(cuenta_archivos "$mnt")
                    if [ "$en_dataset" != "$original" ]; then
                      echo "[ERROR] El dataset tiene $en_dataset archivos y el original $original. Se restaura el original."
                      zfs destroy -r "$ds" 2>/dev/null || true
                      mv "${mnt}.orig" "$mnt"
                      return 1
                    fi

                    rm -rf "${mnt}.mig"
                    echo "[OK] Migración de $ds completada ($en_dataset archivos)."
                    echo "[INFO] El directorio original se conserva en ${mnt}.orig; elimínelo cuando verifique el funcionamiento."
                    return 0
                  }

                  ensure_dataset_with_quota() {
                    ds="$1"
                    quota_val="$2"
                    rec_size="${3:-128K}"
                    if ! zfs list -H "$ds" >/dev/null 2>&1; then
                      migrate_dir_to_dataset "$ds" "$quota_val" "$rec_size" || return 1
                    else
                      current_quota=$(zfs get -H -o value quota "$ds" 2>/dev/null || echo "none")
                      if [ "$current_quota" = "none" ] || [ -z "$current_quota" ]; then
                        echo "[INFO] Asignando cuota por defecto ($quota_val) a $ds..."
                        zfs set "quota=${quota_val}" "$ds"
                      else
                        echo "[INFO] Respetando cuota existente configurada ($current_quota) en $ds."
                      fi
                      zfs set "recordsize=${rec_size}" compression=lz4 atime=off "$ds"
                    fi
                  }

                  # 1. Dataset transaccional para PostgreSQL 16 (páginas de 8K)
                  ensure_dataset_with_quota "tank/nas/postgres" "10G" "8K"
                  zfs set logbias=latency "tank/nas/postgres"

                  # 2. Cuotas departamentales para evitar agotamiento de pool (DoS por disco lleno)
                  ensure_dataset_with_quota "tank/nas/profesores" "10G" "128K"
                  ensure_dataset_with_quota "tank/nas/alumnos" "5G" "128K"
                  ensure_dataset_with_quota "tank/nas/publico" "5G" "128K"

                  # 3. Buffer de salvaguarda anti-bloqueo del pool (Reserva de emergencia COW)
                  if ! zfs list -H "tank/buffer" >/dev/null 2>&1; then
                    echo "[INFO] Creando dataset buffer de emergencia tank/buffer (50M)..."
                    zfs create -o reservation=50M -o compression=off "tank/buffer"
                  fi

                  # 4. Visibilidad de snapshots para Windows Explorer Shadow Copies (VSS)
                  zfs set snapdir=visible tank/nas 2>/dev/null || true
                  zfs set snapdir=visible tank/nas/profesores 2>/dev/null || true
                  zfs set snapdir=visible tank/nas/alumnos 2>/dev/null || true
                  zfs set snapdir=visible tank/nas/publico 2>/dev/null || true

                  # 5. Modo 'Buzón Ciego' en carpeta de entregas (Sticky bit estilo /tmp escolar)
                  mkdir -p /tank/nas/alumnos/entregas
                  chmod 1777 /tank/nas/alumnos/entregas

                  echo "[PASS] Cuotas, buffer y optimizaciones ZFS aplicadas:"
                  zfs get -o name,property,value quota,recordsize,compression,reservation tank/nas/postgres tank/nas/profesores tank/nas/alumnos tank/nas/publico tank/buffer
              securityContext:
                privileged: true
              resources:
                requests:
                  cpu: "50m"
                  memory: "32Mi"
                limits:
                  cpu: "200m"
                  memory: "128Mi"
          restartPolicy: OnFailure
