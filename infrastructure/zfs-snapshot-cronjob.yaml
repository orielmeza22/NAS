---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: zfs-snapshot
  namespace: kube-system
  labels:
    app.kubernetes.io/name: zfs-snapshot
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: nas-platform
spec:
  schedule: "0 2 * * *"
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: zfs-snapshot
        spec:
          hostPID: true
          containers:
          - name: zfs-snapshot
            image: ubuntu:22.04@sha256:09506232a8004baa32c47d68f1e5c307d648fdd59f5e7eaa42aaf87914100db3
            command: ["/bin/bash", "-c"]
            args:
            - |
              set -euo pipefail
              UTC_STAMP=$(date -u +%Y.%m.%d-%H.%M.%S)
              SNAPSHOT_NAME="tank/nas@GMT-${UTC_STAMP}"
              echo "[$(date -Iseconds)] Creating recursive Windows VSS compatible snapshot: $SNAPSHOT_NAME"
              nsenter --target 1 --mount --uts --ipc --net --pid -- sh -c '
                zfs snapshot -r "'"$SNAPSHOT_NAME"'"
                zfs set snapdir=visible tank/nas
                zfs set snapdir=visible tank/nas/profesores 2>/dev/null || true
                zfs set snapdir=visible tank/nas/alumnos 2>/dev/null || true
                zfs set snapdir=visible tank/nas/publico 2>/dev/null || true
              '
              echo "[$(date -Iseconds)] Snapshot created and snapdir configured successfully."
              # Cleanup: sort strictly by creation timestamp (-s creation) on root dataset tank/nas
              # and exclude offsite R2 backup base snapshots (offsite-full-* / offsite-inc-*)
              nsenter --target 1 --mount --uts --ipc --net --pid -- sh -c '
                zfs list -t snapshot -o name -s creation -H tank/nas 2>/dev/null | grep -E "^tank/nas@(k8s-auto-|GMT-)" | head -n -30 | while read -r snap; do
                  zfs release sentinel-immutable "$snap" 2>/dev/null || true
                  zfs destroy -r "$snap" 2>/dev/null || true
                done
              '
              echo "[$(date -Iseconds)] Cleanup complete."
            securityContext:
              privileged: true
            volumeMounts:
            - name: dev
              mountPath: /dev
            - name: zfs-config
              mountPath: /etc/zfs
            resources:
              requests:
                cpu: "100m"
                memory: "128Mi"
              limits:
                cpu: "500m"
                memory: "256Mi"
          restartPolicy: OnFailure
          volumes:
          - name: dev
            hostPath:
              path: /dev
          - name: zfs-config
            hostPath:
              path: /etc/zfs
