apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-pvc
  namespace: default
  labels:
    app.kubernetes.io/name: nextcloud
    app.kubernetes.io/part-of: nas-platform
spec:
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  volumeName: nextcloud-pv
