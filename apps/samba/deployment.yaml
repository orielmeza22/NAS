apiVersion: apps/v1
kind: Deployment
metadata:
  name: samba
  labels:
    app.kubernetes.io/name: samba
    app.kubernetes.io/component: file-server
    app.kubernetes.io/part-of: nas-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: samba
  template:
    metadata:
      labels:
        app.kubernetes.io/name: samba
        app.kubernetes.io/component: file-server
    spec:
      containers:
      - name: samba
        image: dperson/samba@sha256:66088b78a19810dd1457a8f39340e95e663c728083efa5fe7dc0d40b2478e869
        securityContext:
          privileged: false
          capabilities:
            add:
              - NET_ADMIN
              - SYS_ADMIN
              - DAC_OVERRIDE
              - CHOWN
              - FOWNER
              - SETUID
              - SETGID
            drop:
              - ALL
        ports:
        - containerPort: 445
          hostPort: 445
          name: smb
        - containerPort: 137
          name: netbios-ns
          protocol: UDP
        - containerPort: 138
          name: netbios-dgm
          protocol: UDP
        - containerPort: 139
          name: netbios-ssn
        livenessProbe:
          tcpSocket:
            port: 445
          initialDelaySeconds: 30
          periodSeconds: 15
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 445
          initialDelaySeconds: 10
          periodSeconds: 10
        env:
        - name: TZ
          value: "America/Mexico_City"
        - name: WORKGROUP
          value: "ESCUELA"
        - name: USER_PROFESORES
          valueFrom:
            secretKeyRef:
              name: samba-credentials
              key: user-profesores
        - name: USER_ALUMNOS
          valueFrom:
            secretKeyRef:
              name: samba-credentials
              key: user-alumnos
        - name: USER_ADMIN
          valueFrom:
            secretKeyRef:
              name: samba-credentials
              key: user-admin
        - name: VETO
          value: "no"
        args:
        - "-g"
        - "veto files = /*.exe/*.bat/*.cmd/*.msi/*.scr/*.ps1/*.iso/*.torrent/*.encrypted/*.locked/*.crypto/*.wannacry/*.lockbit/*.ryuk/*.akira/*.conti/*DECRYPT*/*RESTORE_FILES*/.apdisk/.DS_Store/.TemporaryItems/.Trashes/desktop.ini/Thumbs.db/"
        - "-g"
        - "delete veto files = no"
        - "-g"
        - "vfs objects = recycle shadow_copy2"
        - "-g"
        - "recycle:repository = .Papelera"
        - "-g"
        - "recycle:keeptree = yes"
        - "-g"
        - "recycle:versions = yes"
        - "-g"
        - "recycle:touch = yes"
        - "-g"
        - "shadow:snapdir = .zfs/snapshot"
        - "-g"
        - "shadow:sort = desc"
        - "-g"
        - "shadow:format = GMT-%Y.%m.%d-%H.%M.%S"
        - "-g"
        - "shadow:snapprefix = ^GMT-[0-9]\\{4\\}\\.[0-9]\\{2\\}\\.[0-9]\\{2\\}-[0-9]\\{2\\}\\.[0-9]\\{2\\}\\.[0-9]\\{2\\}$"
        - "-g"
        - "shadow:delimiter = GMT-"
        - "-g"
        - "shadow:localtime = no"
        - "-s"
        - "profesores;/samba/profesores;yes;no;no;profesor,@docentes,@directivos,juan.perez,admin,admin.it,orielmeza;admin,admin.it,orielmeza;profesor,@docentes,@directivos,juan.perez,admin,admin.it,orielmeza;Espacio Exclusivo Docente"
        - "-s"
        - "mi-espacio;/samba/alumnos/%U;yes;no;no;all;admin,admin.it;all;Espacio Privado Individual del Estudiante/Docente"
        - "-s"
        - "entregas;/samba/alumnos/entregas;yes;no;no;alumno,profesor,@alumnos,@docentes,@directivos,maria.gomez,juan.perez,admin,admin.it,orielmeza;admin,admin.it,orielmeza;alumno,profesor,@alumnos,@docentes,@directivos,maria.gomez,juan.perez,admin,admin.it,orielmeza;Buzon de Entregas y Evaluaciones"
        - "-s"
        - "alumnos;/samba/alumnos;yes;yes;no;alumno,profesor,@alumnos,@docentes,@directivos,maria.gomez,juan.perez,admin,admin.it,orielmeza;admin,admin.it,orielmeza;profesor,@docentes,@directivos,juan.perez,admin,admin.it,orielmeza;Recurso General Alumnos (Solo Lectura Alumnos Escritura Docentes)"
        - "-s"
        - "publico;/samba/publico;yes;no;no;all;none;all;Material Publico Institucional"
        - "-s"
        - "nextcloud;/samba/nextcloud;yes;no;no;admin,admin.it;admin,admin.it;admin,admin.it;Respaldo Administrativo Nextcloud"
        - "-u"
        - "$(USER_PROFESORES)"
        - "-u"
        - "$(USER_ALUMNOS)"
        - "-u"
        - "$(USER_ADMIN)"
        - "-u"
        - "admin;NasEscuela2026!"
        volumeMounts:
        - name: samba-storage
          mountPath: /samba
          mountPropagation: HostToContainer
        - name: samba-private
          mountPath: /var/lib/samba/private
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
      volumes:
      - name: samba-storage
        persistentVolumeClaim:
          claimName: samba-pvc
      - name: samba-private
        hostPath:
          path: /tank/nas/.samba-private
          type: DirectoryOrCreate
